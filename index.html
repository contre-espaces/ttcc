<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TTCC · The Thursday Cupping Club</title>
<meta name="description" content="세 명이 한 봉을 나눠 마시고, 점수를 남깁니다.">
<meta property="og:title" content="TTCC · The Thursday Cupping Club">
<meta property="og:description" content="이번 DROP 별점 남기러 가기">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ttcc.inbeom.com/">
<meta property="og:image" content="https://ttcc.inbeom.com/share.png?v=5">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f6e8da" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a160c" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23181d26'/%3E%3Ccircle cx='46' cy='44' r='6' fill='%23fcab79'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500&family=Space+Grotesk:wght@400&family=Inter:opsz,wght@14..32,400;14..32,500&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
  /* Type & palette: Airtable DESIGN.md (Inter for Haas, signature coral/peach/mint/yellow/cream).
     Components: shadcn/ui anatomy (Card, Badge, Button default/outline, Toggle, Input) with shadcn token names.
     Surface: frosted glass over a warm coffee gradient. */
  :root {
    --foreground: #1c1712; --card-foreground: #1c1712; --muted-foreground: #574b43; --slate: #594d44;
    --primary: #1c1712; --primary-foreground: #fffaf5; --primary-press: #0d0a07;
    --border: rgba(255,255,255,.7); --input: rgba(92,80,72,.42); --ring: rgba(170,45,0,.35); --hair: rgba(28,23,18,.10);
    --glass: rgba(255,250,245,.58); --glass-strong: rgba(255,250,245,.88); --glass-sub: rgba(255,255,255,.45);
    --glass-edge: rgba(255,255,255,.75); --glass-hi: inset 0 1px 0 rgba(255,255,255,.85);
    --glass-shadow: 0 1px 2px rgba(90,40,10,.06), 0 12px 32px -8px rgba(120,50,15,.22);
    --bg-base: #f3e3d3;
    --bg-art: radial-gradient(60% 45% at 12% 8%, #fcd2ae 0%, transparent 70%),
              radial-gradient(55% 40% at 95% 22%, #f39a63 0%, transparent 72%),
              radial-gradient(70% 50% at 20% 80%, #e9b68e 0%, transparent 70%),
              radial-gradient(60% 45% at 90% 95%, #d9784a 0%, transparent 70%),
              linear-gradient(180deg, #f6e8da 0%, #efd3bb 100%);
    --coral: #aa2d00; --peach: #fcab79; --mint: #a8d8c4; --yellow: #f4d35e; --cream: #f5e9d4;
    --dot: #aa2d00; --star: #aa2d00; --star-off: rgba(92,80,72,.32);
    --ok: #1d6b3a; --err: #b30000; --focus: #1b61c9; --placeholder: #6f6359;
    --sig-ink: #1c1712; --radius: 16px;
    --ease: cubic-bezier(.2,.8,.2,1);
    --font: 'Inter', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --foreground: #fbf3ec; --card-foreground: #fbf3ec; --muted-foreground: #d7c6b8; --slate: #c2ae9e;
      --primary: #fff6ee; --primary-foreground: #1c1009; --primary-press: #e8d9cc;
      --border: rgba(255,255,255,.16); --input: rgba(255,240,228,.32); --ring: rgba(252,171,121,.4); --hair: rgba(255,255,255,.10);
      --glass: rgba(255,236,220,.08); --glass-strong: rgba(36,18,9,.82); --glass-sub: rgba(255,236,220,.06);
      --glass-edge: rgba(255,255,255,.16); --glass-hi: inset 0 1px 0 rgba(255,255,255,.14);
      --glass-shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -12px rgba(0,0,0,.6);
      --bg-base: #1e120b;
      --bg-art: radial-gradient(60% 40% at 15% 6%, #7a3a17 0%, transparent 72%),
                radial-gradient(55% 40% at 95% 30%, #a2481b 0%, transparent 70%),
                radial-gradient(70% 50% at 10% 85%, #4a2312 0%, transparent 70%),
                radial-gradient(60% 45% at 85% 95%, #6b2c10 0%, transparent 72%),
                linear-gradient(180deg, #2a160c 0%, #170d08 100%);
      --dot: #fcab79; --star: #fcab79; --star-off: rgba(255,240,228,.24);
      --ok: #7fe0a5; --err: #ff9a8e; --focus: #8fb8ff; --placeholder: #b9a595;
    }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; -webkit-text-size-adjust: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; background: var(--bg-base); }
  body { margin: 0; color: var(--foreground); font: 14px/1.45 var(--font); font-optical-sizing: auto; background: transparent; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--bg-art), var(--bg-base); }
  button { font: inherit; cursor: pointer; color: inherit; }
  input { font: inherit; caret-color: var(--coral); }
  input::placeholder { color: var(--placeholder); }
  a { color: var(--foreground); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  ::selection { background: var(--peach); color: #1c1712; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .skip { position: absolute; left: 12px; top: -60px; z-index: 10; padding: 12px 16px; min-height: 44px; border-radius: 12px; background: var(--primary); color: var(--primary-foreground); font-size: 14px; font-weight: 500; text-decoration: none; }
  .skip:focus { top: 8px; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  main:focus { outline: none; }
  .num, .mono { font-variant-numeric: tabular-nums; }
  h1, h2 { text-wrap: balance; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* glass primitive (shadcn Card surface) */
  .glass, nav, .card-stone, .list, .scores, .me-btn, .st, .btn-line, .note input {
    background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--glass-hi), var(--glass-shadow);
    -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
  }

  /* nav: floating glass bar */
  nav { -webkit-backdrop-filter: blur(28px) saturate(170%); backdrop-filter: blur(28px) saturate(170%); }
  nav { position: sticky; top: 8px; z-index: 5; margin: 8px 8px 0; height: 68px; padding: 0 12px 0 16px; gap: 12px; display: flex; align-items: center; justify-content: space-between; border-radius: 20px; background: var(--glass-strong); }
  .brand { display: flex; align-items: center; gap: 12px; min-height: 44px; min-width: 0; text-decoration: none; }
  .logo { font-family: 'Google Sans', var(--font); font-weight: 500; font-size: 34px; line-height: 1; letter-spacing: -0.04em; color: var(--primary); }
  .logo i { font-style: normal; color: var(--dot); }
  .bar { width: 1px; height: 34px; background: var(--hair); flex-shrink: 0; }
  .brand-txt { display: flex; flex-direction: column; min-width: 0; font: 400 16px/1.2 'Space Grotesk', var(--font); letter-spacing: -0.01em; color: var(--primary); white-space: nowrap; }
  .me-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; font-size: 14px; font-weight: 500; flex-shrink: 0; background: var(--glass-sub); box-shadow: var(--glass-hi); }

  /* view-only notice: mint-tinted glass */
  .card-stone { margin: 12px 12px 0; padding: 18px 20px; border-radius: var(--radius); display: flex; flex-direction: column; gap: 4px;
    background: linear-gradient(140deg, rgba(168,216,196,.85), rgba(168,216,196,.6)); color: var(--sig-ink); }
  .card-stone h2 { margin: 0; font-size: 16px; font-weight: 500; }
  .card-stone p { margin: 0; font-size: 14px; color: #1f3d33; }

  /* Drop: glossy coral glass card */
  .drop { position: relative; overflow: hidden; isolation: isolate; margin: 12px 12px 0; padding: 28px 22px 22px; border-radius: 22px; color: #fff; display: flex; flex-direction: column; gap: 18px;
    background: linear-gradient(150deg, #ec5a24 0%, #c43a08 38%, #8e2400 72%, #521404 100%);
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 18px 40px -14px rgba(170,45,0,.6), 0 2px 6px rgba(80,20,0,.18); }
  .drop::before { content: ""; position: absolute; z-index: -1; inset: -40% 30% 40% -30%; background: radial-gradient(closest-side, rgba(255,214,170,.38), transparent); filter: blur(8px); }
  .drop::after { content: ""; position: absolute; z-index: -1; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.14), transparent 38%); pointer-events: none; }
  .drop .meta { margin: -8px 0 0; font-size: 14px; color: #fff; font-variant-numeric: tabular-nums; }
  .drop h1 { margin: 0; font: 500 72px/1 var(--font); letter-spacing: -0.035em; color: #fff; text-shadow: 0 2px 18px rgba(80,15,0,.25); }
  .drop h1 i { font-style: normal; color: var(--peach); }
  @media (max-width: 359px) { .drop h1 { font-size: 60px; } }
  .drop-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .drop .mine { font-size: 14px; color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .drop .mine b { font-weight: 500; color: #fff; }
  /* shadcn Progress */
  .track { flex: 0 1 180px; height: 8px; border-radius: 9999px; background: rgba(255,255,255,.22); box-shadow: inset 0 1px 2px rgba(60,10,0,.25); overflow: hidden; }
  .track i { display: block; height: 100%; width: 100%; border-radius: 9999px; background: linear-gradient(90deg, #ffe2c8, #fff); box-shadow: 0 0 12px rgba(255,220,190,.8); transform: scaleX(0); transform-origin: left center; transition: transform 300ms var(--ease); }
  /* shadcn ToggleGroup on glass */
  .drops { display: flex; flex-wrap: wrap; gap: 8px; }
  .drops button { height: 40px; min-width: 64px; padding: 0 16px; border-radius: 9999px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); position: relative; }
  .drops button::after { content: ""; position: absolute; inset: -3px 0; }
  .drops button[aria-pressed="true"] { background: rgba(255,255,255,.95); color: #8e2400; border-color: #fff; }

  /* section header (shadcn CardHeader outside card) */
  .sec-h { margin: 32px 22px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sec-h h2 { margin: 0; font: 500 22px/1.2 var(--font); letter-spacing: -0.01em; color: var(--primary); }
  .sec-h span { font-size: 13px; color: var(--slate); }

  /* lists live inside a glass Card */
  .list { margin: 0 12px; padding: 4px 14px; border-radius: var(--radius); display: flex; flex-direction: column; }
  .bean { border-top: 1px solid var(--hair); scroll-margin-top: 92px; }
  .bean:first-child { border-top: 0; }
  .bean.focus { animation: flash 2s ease-out; }
  @keyframes flash { 0%, 30% { background: rgba(252,171,121,.28); } 100% { background: transparent; } }
  .row { width: 100%; min-height: 76px; padding: 16px 2px; border: 0; background: transparent; text-align: left; display: flex; align-items: center; gap: 12px; }
  .row .no { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 500; color: var(--slate); width: 40px; flex-shrink: 0; }
  .row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row .nm { font: 500 16px/1.3 var(--font); color: var(--primary); text-wrap: pretty; overflow-wrap: anywhere; }
  .row .mt { font-size: 13px; color: var(--muted-foreground); }
  /* shadcn Button outline (glass) / Badge */
  .st { flex-shrink: 0; display: inline-flex; align-items: center; height: 36px; font-size: 13px; font-weight: 500; padding: 0 14px; border-radius: 9999px; color: var(--primary); white-space: nowrap; background: var(--glass-sub); }
  .st.done { background: linear-gradient(140deg, #ffc9a2, #fca06a); color: var(--sig-ink); border-color: rgba(255,255,255,.6); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 6px 16px -6px rgba(240,120,60,.55); }
  .panel { padding: 0 2px 22px 54px; display: flex; flex-direction: column; gap: 16px; }
  /* flavour notes: shadcn Badge in the signature palette, slightly translucent glass */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: 13px; font-weight: 500; padding: 5px 11px; border-radius: 9999px; color: var(--sig-ink); background: rgba(252,171,121,.88); border: 1px solid rgba(255,255,255,.55); box-shadow: inset 0 1px 0 rgba(255,255,255,.55); }
  .chips span:nth-child(4n+2) { background: rgba(168,216,196,.9); }
  .chips span:nth-child(4n+3) { background: rgba(244,211,94,.9); }
  .chips span:nth-child(4n+4) { background: rgba(245,233,212,.92); }
  .facts { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted-foreground); }
  .facts a { color: var(--foreground); font-weight: 500; }
  .cap { font-size: 13px; color: var(--slate); }
  .stars { display: flex; margin-left: -6px; }
  .ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; vertical-align: -0.125em; flex-shrink: 0; }
  .ic-fill { fill: currentColor; }
  .ic-sm { width: .9em; height: .9em; }
  .stars button { width: 48px; height: 48px; border: 0; background: transparent; padding: 0; font-size: 30px; line-height: 0; color: var(--star-off); display: inline-flex; align-items: center; justify-content: center; }
  .stars button.on { color: var(--star); filter: drop-shadow(0 3px 8px rgba(240,110,40,.45)); }
  .stars button.on .ic { fill: currentColor; }
  .st .ic, .scores .val .ic { fill: currentColor; font-size: .85em; margin-right: 4px; }
  .scores .val .ic { color: var(--star); }
  .saved { font-size: 13px; color: var(--ok); }
  .saved.err { color: var(--err); }
  .scores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: 14px; background: var(--glass-sub); box-shadow: var(--glass-hi); }
  .scores div { padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .scores div + div { border-left: 1px solid var(--hair); }
  .scores .who { font-size: 12px; font-weight: 500; color: var(--slate); }
  .scores .val { display: flex; align-items: center; font: 500 20px var(--font); font-variant-numeric: tabular-nums; color: var(--primary); }
  .scores .nt { font-size: 12px; color: var(--muted-foreground); overflow-wrap: anywhere; }
  /* shadcn Input + Button default */
  .note { display: flex; gap: 8px; }
  .note input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border-radius: 12px; border-color: var(--input); background: var(--glass-sub); color: var(--foreground); font-size: 16px; box-shadow: var(--glass-hi); transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease); }
  .note input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px var(--ring); outline: none; }
  .note button, .btn { height: 44px; padding: 0 20px; border-radius: 12px; border: 0; background: var(--primary); color: var(--primary-foreground); font-size: 14px; font-weight: 500; box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 8px 20px -8px rgba(30,15,5,.45); }
  .note button[aria-disabled="true"], .stars button[aria-disabled="true"] { opacity: .5; cursor: progress; }

  /* Hall of Fame: cream-tinted glass card */
  #viewHall { background: linear-gradient(150deg, rgba(245,233,212,.88), rgba(245,233,212,.66)); color: var(--sig-ink); border-color: rgba(255,255,255,.7); }
  .hall-row { min-height: 64px; padding: 14px 2px; border-top: 1px solid rgba(28,23,18,.12); display: flex; align-items: center; gap: 12px; }
  .hall-row:first-child { border-top: 0; }
  .hall-row .rk { font-size: 14px; font-weight: 500; color: var(--coral); width: 18px; font-variant-numeric: tabular-nums; }
  .hall-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .hall-row .nm { font: 500 16px/1.3 var(--font); }
  .hall-row .mt { font-size: 13px; color: #4f453d; }
  .hall-row .av { font: 500 22px var(--font); font-variant-numeric: tabular-nums; }
  #viewHall .empty { color: #4f453d; }
  @media (prefers-color-scheme: dark) {
    #viewHall { background: linear-gradient(150deg, rgba(252,171,121,.26), rgba(255,236,220,.06)); color: var(--foreground); border-color: var(--glass-edge); }
    .hall-row { border-top-color: var(--hair); }
    .hall-row .rk { color: var(--peach); }
    .hall-row .mt, #viewHall .empty { color: var(--muted-foreground); }
  }

  .skel { display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 16px 2px; border-top: 1px solid var(--hair); }
  .skel:first-child { border-top: 0; }
  .skel i { display: block; height: 12px; border-radius: 6px; background: var(--hair); }
  .skel i:first-child { width: 34px; }
  .skel span { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .skel span i:last-child { width: 45%; }
  .btn-line { height: 44px; padding: 0 20px; border-radius: 12px; color: var(--primary); font-size: 14px; font-weight: 500; }
  .empty { padding: 32px 4px; text-align: center; color: var(--muted-foreground); font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .status { margin: 12px 22px 0; font-size: 13px; color: var(--slate); }
  .status:empty { display: none; }
  footer { margin-top: 40px; padding: 48px 20px calc(40px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  footer .f-logo { font-size: 56px; letter-spacing: -0.04em; }
  footer small { font-size: 13px; color: var(--slate); }

  /* motion: press states */
  .drops button, .st, .note button, .stars button, .btn-line { transition: background-color 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease), transform 150ms var(--ease); }
  .drops button:active, .note button:active, .btn-line:active, .st:active { transform: scale(.97); transition-duration: 90ms; }
  .note button:active { background: var(--primary-press); }
  .stars button:active { transform: scale(.9); transition-duration: 90ms; }

  /* no blur support or user asks for less transparency: solid surfaces, same layout */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --glass: rgba(255,250,245,.94); --glass-strong: rgba(255,250,245,.97); --glass-sub: rgba(255,255,255,.7); }
  }
  @media (prefers-reduced-transparency: reduce) {
    :root { --glass: #fbf4ee; --glass-strong: #fbf4ee; --glass-sub: #ffffff; }
    .glass, nav, .card-stone, .list, .scores, .me-btn, .st, .btn-line, .note input, .drops button { -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: dark) {
    :root { --glass: #2a1a11; --glass-strong: #2a1a11; --glass-sub: #332116; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-property: color, background-color, border-color, opacity !important; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <a class="skip" href="#main">원두 목록으로 바로 가기</a>
  <nav>
    <a class="brand" href="#" translate="no">
      <span class="logo" aria-hidden="true">TTCC<i>.</i></span>
      <span class="bar" aria-hidden="true"></span>
      <span class="brand-txt"><span>The Thursday</span> <span>Cupping Club</span></span>
    </a>
    <span class="me-btn" id="meBtn" translate="no" hidden><span class="sr">나: </span><span id="meTxt"></span></span>
  </nav>

  <section class="card-stone" id="picker" hidden aria-labelledby="pickerTitle">
    <div>
      <h2 id="pickerTitle">지금은 구경만 할 수 있어요</h2>
      <p id="pickerTxt">카톡으로 받은 내 링크로 한 번만 들어오면 별점을 남길 수 있어요.</p>
    </div>
  </section>

  <section class="drop" id="dropBox" hidden>
    <h1 translate="no"><span><span id="dropTitle">Drop</span><i aria-hidden="true">.</i></span></h1>
    <p class="meta" id="dropLbl"></p>
    <div class="drop-foot">
      <div class="mine" id="mine">내 평가 <b id="mineN">0/0</b></div>
      <div class="track" aria-hidden="true"><i id="trackFill"></i></div>
    </div>
    <div class="drops" id="drops" aria-label="DROP 고르기"></div>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="sr" id="live" role="status" aria-live="polite"></div>
  <main id="main" tabindex="-1">
    <section aria-labelledby="hLine">
      <div class="sec-h"><h2 id="hLine">Line-up</h2><span id="lineCount" class="num"></span></div>
      <div class="list" id="viewDrop"></div>
    </section>
    <section aria-labelledby="hHall">
      <div class="sec-h"><h2 id="hHall">Hall of Fame</h2><span>2명 이상 평가 · 평균 순</span></div>
      <div class="list" id="viewHall"></div>
    </section>
  </main>

  <footer>
    <span class="logo f-logo" aria-label="TTCC">TTCC<i>.</i></span>
    <small>Since 2026</small>
  </footer>
</div>

<script>
(function () {
  'use strict';
  const API = 'https://script.google.com/macros/s/AKfycbzkUXMN1lVGd1rwpKUJiw7ZeJJJGAlD-EnhEfrC5NwiLdvKotnuZYnJPMtM5LUegQgcrQ/exec';
  const KEY_ME = 'ttcc.me', KEY_DATA = 'ttcc.data', KEY_KEY = 'ttcc.key';
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장 불가 환경 */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } }
  };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => ('0' + n).slice(-2);
  const ICON = {
    star: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9z"/></svg>',
    out: '<svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16 16 8M9.5 8H16v6.5"/></svg>'
  };

  const S = {
    data: null, me: store.get(KEY_ME), tab: 'drop', drop: null, open: null,
    msg: {},            // 원두별 저장 상태 { text, err }
    draft: {},          // 저장 전 감상 (다시 그려도 유지)
    busy: {}            // 원두별 저장 중
  };
  if (S.me && ['IB', 'HJ', 'KC'].indexOf(S.me) < 0) S.me = null;

  // ---------- 개인 링크 (#key=…) ----------
  function takeKey() {
    const km = location.hash.match(/^#key=([0-9a-f]{24})$/);
    if (!km) return false;
    if (km[1] !== store.get(KEY_KEY)) { store.del(KEY_ME); S.me = null; }
    store.set(KEY_KEY, km[1]);
    S.key = km[1]; S.badKey = false;
    history.replaceState(null, '', location.pathname);   // 주소창·공유에 키가 남지 않게
    return true;
  }
  takeKey();
  S.key = store.get(KEY_KEY);
  if (!S.key) S.me = null;                                 // 키 없이 고른 예전 멤버 선택은 무효
  S.badKey = false;

  async function whoami() {
    if (!S.key) return;
    try {
      const r = await fetch(API + '?api=whoami&key=' + S.key, { cache: 'no-store', credentials: 'omit' });
      const d = await r.json();
      if (d.ok) { S.me = d.member; store.set(KEY_ME, S.me); }
      else if (d.error === 'KEY') { S.me = null; S.key = null; S.badKey = true; store.del(KEY_KEY); store.del(KEY_ME); }
    } catch (e) { /* 오프라인: 기억한 멤버로 계속 */ }
    render();
  }

  // ---------- 데이터 ----------
  try { const c = JSON.parse(store.get(KEY_DATA) || 'null'); if (c && c.ok) S.data = c; } catch (e) { /* 캐시 무시 */ }

  async function load(fresh) {
    setStatus(S.data ? '' : '원두 목록 불러오는 중…');
    try {
      const r = await fetch(API + (fresh ? '?fresh=1' : ''), { cache: 'no-store', credentials: 'omit' });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '불러오기 실패');
      S.data = d; S.failed = false;
      store.set(KEY_DATA, JSON.stringify(d));
      setStatus('');
    } catch (e) {
      S.failed = !S.data;
      setStatus(S.data ? '최신 정보를 못 불러와서 저장된 화면을 보여드려요.' : '');
    }
    applyHash();
    render();
  }

  async function send(body) {
    // text/plain 단순 요청 → 미리 확인(preflight) 없이 Apps Script로 전송
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(body), credentials: 'omit', redirect: 'follow' });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '저장 실패');
    return d;
  }

  // ---------- 계산 ----------
  const beans = () => (S.data && S.data.beans) || [];
  const drops = () => [...new Set(beans().map((b) => b.drop))].sort((a, b) => b - a);
  const curDrop = () => (S.drop && drops().indexOf(S.drop) >= 0 ? S.drop : drops()[0]);
  const inDrop = (d) => beans().filter((b) => b.drop === d);
  const myScore = (b) => (S.me && b.ratings[S.me] ? b.ratings[S.me].score : 0);
  const avgOf = (b) => { const v = Object.values(b.ratings).map((r) => r.score); return v.length ? v.reduce((a, c) => a + c, 0) / v.length : null; };
  const daysSince = (iso) => { if (!iso) return null; const t = new Date(iso + 'T00:00:00+09:00'); const n = Math.floor((Date.now() - t.getTime()) / 86400000); return n >= 0 ? n : null; };
  const metaOf = (b) => {
    const parts = [b.country || (b.roaster ? '' : '원두 정보 채우는 중')].filter(Boolean);
    if (b.roaster) parts.unshift(b.roaster);
    const d = daysSince(b.roast);
    if (d != null) parts.push('로스팅 +' + d + '일');
    return parts.join(' · ');
  };

  // ---------- 그리기 ----------
  function setStatus(t) { $('#status').textContent = t; }
  function announce(t) { const el = $('#live'); el.textContent = ''; setTimeout(() => { el.textContent = t; }, 50); }
  const fmtNum = new Intl.NumberFormat('ko-KR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fmtDay = new Intl.DateTimeFormat('ko-KR', { month: 'numeric', day: 'numeric', timeZone: 'Asia/Seoul' });
  const dayText = (iso) => {
    const parts = fmtDay.formatToParts(new Date(iso + 'T12:00:00+09:00'));
    const v = (t) => (parts.find((x) => x.type === t) || {}).value || '';
    return pad(v('month')) + '.' + pad(v('day'));
  };

  // 다시 그려도 포커스·입력 위치 유지
  function focusKey(el) {
    if (!el || el === document.body) return null;
    if (el.id && el.id.indexOf('n-') === 0) return { sel: '#' + el.id, caret: el.selectionStart };
    const d = el.dataset || {};
    if (d.rate) return { sel: '[data-rate="' + d.rate + '"][data-n="' + d.n + '"]' };
    if (d.note) return { sel: '[data-note="' + d.note + '"]' };
    if (d.open) return { sel: '[data-open="' + d.open + '"]' };
    if (d.drop) return { sel: '[data-drop="' + d.drop + '"]' };
    if (d.me) return { sel: '[data-me="' + d.me + '"]' };
    return null;
  }
  function restoreFocus(k) {
    if (!k) return;
    const el = document.querySelector(k.sel);
    if (!el) return;
    el.focus({ preventScroll: true });
    if (k.caret != null && el.setSelectionRange) el.setSelectionRange(k.caret, k.caret);
  }

  function render() {
    const fk = focusKey(document.activeElement);
    paint();
    restoreFocus(fk);
  }

  function paint() {
    // 멤버
    $('#picker').hidden = !!S.me;
    $('#meBtn').hidden = !S.me;
    $('#meTxt').textContent = S.me || '';
    if (S.badKey) $('#pickerTxt').textContent = '이 링크는 이제 안 돼요. 새 링크를 받아주세요.';

    // DROP 박스
    const d = curDrop();
    const list = d ? inDrop(d) : [];
    $('#dropBox').hidden = !d;
    if (d) {
      const isLatest = d === drops()[0];
      const arrived = list.map((b) => b.arrived).filter(Boolean).sort()[0];
      $('#dropLbl').textContent = [isLatest ? '최신' : '지난 DROP', arrived ? dayText(arrived) + ' 도착' : ''].filter(Boolean).join(' · ');
      $('#dropTitle').textContent = 'Drop ' + pad(d);
      const done = S.me ? list.filter((b) => myScore(b)).length : 0;
      $('#mineN').textContent = done + '/' + list.length;
      $('#trackFill').style.transform = 'scaleX(' + (list.length ? done / list.length : 0) + ')';
      $('#drops').hidden = drops().length < 2;
      $('#drops').innerHTML = drops().map((x) => `<button type="button" aria-pressed="${x === d}" data-drop="${x}">${pad(x)}</button>`).join('');
    }

    $('#lineCount').textContent = list.length ? list.length + '봉' : '';

    renderDrop(list);
    renderHall();
  }

  function renderDrop(list) {
    const el = $('#viewDrop');
    if (!S.data) {
      el.innerHTML = S.failed
        ? '<div class="empty"><span>원두 목록을 불러오지 못했어요.</span><button type="button" class="btn-line" data-retry="1">다시 불러오기</button></div>'
        : '<div aria-hidden="true">' + '<div class="skel"><i></i><span><i></i><i></i></span></div>'.repeat(3) + '</div>';
      return;
    }
    if (!list.length) {
      el.innerHTML = '<div class="empty"><span>첫 DROP을 기다리는 중이에요.</span><span>원두가 도착하면 여기에 올라와요.</span></div>';
      return;
    }
    el.innerHTML = list.map((b) => {
      const mine = myScore(b);
      const open = S.open === b.id;
      const status = !S.me ? '보기' : mine ? ICON.star + mine : '평가하기';
      const others = ['IB', 'HJ', 'KC'].filter((w) => w !== S.me && b.ratings[w]).length;
      const msg = S.msg[b.id];
      const facts = [
        b.origin && esc(b.origin),
        b.varieties.length && esc(b.varieties.join(' · ')),
        b.process && esc(b.process),
        /^https:\/\//i.test(b.url || '') && `<a href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">상품 페이지 ${ICON.out}<span class="sr"> (새 창)</span></a>`
      ].filter(Boolean).map((x) => `<span>${x}</span>`).join('');
      let panel = '';
      if (open) {
        panel = `<div class="panel" id="p-${b.id}">
          ${b.notes.length ? `<div class="chips">${b.notes.map((n) => `<span>${esc(n)}</span>`).join('')}</div>` : ''}
          ${facts ? `<div class="facts">${facts}</div>` : ''}
          ${!S.me ? '<div class="cap">내 링크로 들어오면 별점을 남길 수 있어요.</div>' : `
            <div style="display:flex;flex-direction:column;gap:6px">
              <div class="cap">내 점수 · ${S.me}</div>
              <div class="stars" role="radiogroup" aria-label="별점">
                ${[1, 2, 3, 4, 5].map((n) => `<button type="button" role="radio" aria-checked="${n === mine}" aria-label="${n}점" class="${n <= mine ? 'on' : ''}" data-rate="${b.id}" data-n="${n}" aria-disabled="${!!S.busy[b.id]}">${ICON.star}</button>`).join('')}
              </div>
            </div>
            ${msg ? `<div class="saved ${msg.err ? 'err' : ''}">${esc(msg.text)}</div>` : ''}
            ${mine ? `
              <div class="scores">${['IB', 'HJ', 'KC'].map((w) => {
                const r = b.ratings[w];
                return `<div><span class="who mono" translate="no">${w}${w === S.me ? ' (나)' : ''}</span><span class="val">${r ? ICON.star + r.score : '<span aria-label="아직 없음">–</span>'}</span>${r && r.note ? `<span class="nt">${esc(r.note)}</span>` : ''}</div>`;
              }).join('')}</div>
              <label style="display:flex;flex-direction:column;gap:6px">
                <span class="cap">한 줄 감상 (선택)</span>
                <span class="note">
                  <input type="text" name="note" autocomplete="off" enterkeyhint="done" maxlength="300" id="n-${b.id}" placeholder="예: 식으면서 복숭아가 올라옴…" value="${esc(S.draft[b.id] != null ? S.draft[b.id] : ((b.ratings[S.me] || {}).note || ''))}">
                  <button type="button" data-note="${b.id}" aria-disabled="${!!S.busy[b.id]}">${S.busy[b.id] ? '저장 중…' : '저장'}</button>
                </span>
              </label>`
            : `<div class="cap">블라인드 커핑: 내 점수를 남기면 다른 멤버 점수가 열려요. (${others}명 평가함)</div>`}`}
        </div>`;
      }
      return `<article class="bean" id="b-${b.id}">
        <button type="button" class="row" aria-expanded="${open}" aria-controls="p-${b.id}" data-open="${b.id}">
          <span class="no mono">${esc(b.no)}</span>
          <span class="tx"><span class="nm" translate="no">${esc(b.name)}</span><span class="mt">${esc(metaOf(b))}</span></span>
          <span class="st ${mine ? 'done' : ''}"${mine ? ` aria-label="내 점수 ${mine}점"` : ''}>${status}</span>
        </button>${panel}
      </article>`;
    }).join('');
  }

  function renderHall() {
    const el = $('#viewHall');
    const ranked = beans()
      .filter((b) => Object.keys(b.ratings).length >= 2)
      .map((b) => ({ b, avg: avgOf(b) }))
      .sort((x, y) => y.avg - x.avg || Object.keys(y.b.ratings).length - Object.keys(x.b.ratings).length)
      .slice(0, 10);
    el.innerHTML = (ranked.length
      ? ranked.map((x, i) => `<div class="hall-row">
          <span class="rk mono num">${i + 1}</span>
          <span class="tx"><span class="nm" translate="no">${esc(x.b.name)}</span><span class="mt">${[`DROP ${pad(x.b.drop)}`, x.b.roaster, x.b.country, Object.keys(x.b.ratings).length + '명'].filter(Boolean).map(esc).join(' · ')}</span></span>
          <span class="av">${fmtNum.format(x.avg)}</span>
        </div>`).join('')
      : '<div class="empty">두 명 이상 평가한 원두가 생기면 여기에 올라와요.</div>');
  }

  // ---------- 동작 ----------
  async function rate(id, n, note) {
    const b = beans().find((x) => x.id === id);
    if (!b || !S.me || S.busy[id]) return;
    const prev = b.ratings[S.me] ? Object.assign({}, b.ratings[S.me]) : null;
    b.ratings[S.me] = { score: n, note: note != null ? note : (prev ? prev.note : '') };
    S.busy[id] = true;
    S.msg[id] = { text: '저장 중…' };
    render();
    try {
      await send({ bean: id, key: S.key, member: S.me, score: n, note: note });
      S.msg[id] = { text: note != null ? '✓ 감상까지 저장됐어요' : '✓ 저장됐어요 · 다시 누르면 바뀌어요' };
      if (note != null) delete S.draft[id];
      store.set(KEY_DATA, JSON.stringify(S.data));
      announce(b.name + ' ' + n + '점' + (note != null ? ', 감상' : '') + ' 저장됨');
    } catch (e) {
      if (prev) b.ratings[S.me] = prev; else delete b.ratings[S.me];
      console.warn('TTCC 저장 실패:', e);
      const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
      if (/KEY/.test(e.message)) { S.badKey = true; S.me = null; S.key = null; store.del(KEY_KEY); store.del(KEY_ME); }
      S.msg[id] = { text: S.badKey ? '링크가 바뀌었어요. 새 링크로 다시 들어와 주세요.' : offline ? '인터넷 연결을 확인하고 다시 눌러주세요.' : '저장하지 못했어요. 잠시 후 다시 눌러주세요.', err: true };
      announce('저장하지 못했어요. 다시 눌러주세요.');
    }
    S.busy[id] = false;
    render();
  }

  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('button, a');
    if (!t) return;
    if (t.dataset.retry) { S.failed = false; render(); load(true); return; }
    if (t.dataset.drop) { S.drop = Number(t.dataset.drop); S.open = null; history.replaceState(null, '', '#d-' + S.drop); render(); return; }
    if (t.dataset.open) {
      S.open = S.open === t.dataset.open ? null : t.dataset.open;
      history.replaceState(null, '', S.open ? '#b-' + S.open : (S.drop ? '#d-' + S.drop : location.pathname));
      render();
      return;
    }
    if (t.dataset.rate) { rate(t.dataset.rate, Number(t.dataset.n)); return; }
    if (t.dataset.note) {
      const id = t.dataset.note;
      const b = beans().find((x) => x.id === id);
      const v = S.draft[id] != null ? S.draft[id] : (($('#n-' + id) || {}).value || '');
      if (b && myScore(b)) rate(id, myScore(b), v.trim());
    }
  });
  document.addEventListener('input', (ev) => {
    const id = ev.target.id || '';
    if (id.indexOf('n-') === 0) S.draft[id.slice(2)] = ev.target.value;
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.id && ev.target.id.indexOf('n-') === 0) {
      const btn = document.querySelector('[data-note="' + ev.target.id.slice(2) + '"]');
      if (btn) btn.click();
    }
  });

  // #b-<원두ID>로 열면 그 원두를 펼침 (노션 '별점 링크')
  function applyHash() {
    const dm = location.hash.match(/^#d-(\d+)$/);
    if (dm) { S.drop = Number(dm[1]); return; }
    const m = location.hash.match(/^#b-([0-9a-f]{32})$/);
    if (!m) return;
    const b = beans().find((x) => x.id === m[1]);
    if (!b) return;
    S.drop = b.drop; S.open = b.id;
    requestAnimationFrame(() => {
      const el = document.getElementById('b-' + b.id);
      if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('focus'); }
    });
  }
  window.addEventListener('hashchange', () => { if (takeKey()) { whoami(); return; } applyHash(); render(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.data) load(false); });

  if (S.data) { applyHash(); render(); }
  load(true);
  whoami();
})();
</script>
</body>
</html>
