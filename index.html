<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TTCC · The Thursday Cupping Club</title>
<meta name="description" content="세 명이 한 봉을 나눠 마시고, 점수를 남깁니다.">
<meta property="og:title" content="TTCC · The Thursday Cupping Club">
<meta property="og:description" content="이번 DROP 별점 남기러 가기">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ttcc.inbeom.com/">
<meta property="og:image" content="https://ttcc.inbeom.com/share.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317171c'/%3E%3Ccircle cx='46' cy='44' r='6' fill='%23ff7759'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
  :root {
    --ink: #212121; --primary: #17171c; --muted: #616161; --slate: #75758a; --hair: #d9d9dd; --soft: #f2f2f2;
    --stone: #eeece7; --green: #003c33; --coral: #ff7759; --coral-soft: #ffad9b; --coral-ink: #b33f24; --coral-bg: #fff6f3;
    --ok: #1d6b3a; --err: #b30000; --focus: #1863dc;
    --bg: #ffffff; --on-primary: #ffffff; --hover: #f4f4f5; --primary-hover: #2e2e36; --placeholder: #6e6e7a; --ring: rgba(23,23,28,.12); --field: #8e8e9a;
    --ease: cubic-bezier(.2,.8,.2,1); --ease-enter: cubic-bezier(.22,1,.36,1);
    --display: 'Space Grotesk', 'Noto Sans KR', sans-serif;
    --body: 'Google Sans', 'Noto Sans KR', system-ui, sans-serif;
    --head: 'Google Sans', 'Noto Sans KR', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e8ea; --primary: #f4f4f5; --muted: #a8a8b0; --slate: #9898a6; --hair: #33333b; --soft: #222228;
      --stone: #26262c; --green: #3fb59a; --coral-soft: #8a4535; --coral-ink: #ffa08a; --coral-bg: #2a1814;
      --ok: #5ccf8c; --err: #ff7a6e; --focus: #6ea2ff;
      --bg: #111114; --on-primary: #111114; --hover: #1e1e24; --primary-hover: #d4d4d8; --placeholder: #8c8c98; --ring: rgba(244,244,245,.18); --field: #66667a;
    }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; -webkit-text-size-adjust: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); }
  button { font: inherit; cursor: pointer; color: inherit; }
  input { font: inherit; }
  input::placeholder { color: var(--placeholder); }
  a { color: var(--ink); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  ::selection { background: var(--coral); color: #111114; }
  input { caret-color: var(--coral); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .skip { position: absolute; left: 12px; top: -60px; z-index: 10; padding: 12px 16px; min-height: 44px; box-sizing: border-box; border-radius: 30px; background: var(--primary); color: var(--on-primary); font-size: 13px; text-decoration: none; }
  .skip:focus { top: 8px; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  main:focus { outline: none; }
  .num { font-variant-numeric: tabular-nums; }
  h1, h2 { text-wrap: balance; }
  .mono { font-family: var(--mono); letter-spacing: 0.28px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  nav { height: 72px; padding: 0 16px 0 20px; gap: 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--soft); background: var(--bg); position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 12px; min-height: 44px; min-width: 0; text-decoration: none; }
  .logo { font-family: 'Google Sans', var(--display); font-weight: 500; font-size: 36px; line-height: 1; letter-spacing: -0.04em; color: var(--primary); }
  .logo i { font-style: normal; color: var(--coral); }
  .bar { width: 1px; height: 36px; background: var(--hair); flex-shrink: 0; }
  .brand-txt { display: flex; flex-direction: column; min-width: 0; font: 400 17px/1.15 var(--display); letter-spacing: -0.2px; color: var(--primary); white-space: nowrap; }
      .me-btn { height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 4px; border-radius: 30px; border: 1px solid var(--primary); background: transparent; font-size: 14px; font-weight: 500; flex-shrink: 0; }

  .card-stone { margin: 12px 12px 0; padding: 20px; border-radius: 8px; background: var(--stone); display: flex; flex-direction: column; gap: 12px; }
  .card-stone h2 { margin: 0; font-size: 16px; font-weight: 500; }
  .card-stone p { margin: 0; font-size: 13px; color: var(--muted); }

  .drop { padding: 36px 20px 28px; display: flex; flex-direction: column; gap: 22px; border-bottom: 1px solid var(--soft); }
  .drop .meta { margin-top: -10px; font: 13px var(--body); letter-spacing: 0; color: var(--slate); font-variant-numeric: tabular-nums; }
  .drop h1 { margin: 0; font: 500 76px/.9 var(--head); letter-spacing: -0.04em; color: var(--primary); padding-bottom: 6px; }
  .drop h1 i { font-style: normal; color: var(--coral); }
  @media (max-width: 359px) { .drop h1 { font-size: 64px; } }
  .drop-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .drop .mine { font: 12px var(--mono); letter-spacing: 1px; color: var(--slate); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .drop .mine b { font-weight: 400; color: var(--primary); }
  .track { flex: 0 1 180px; height: 12px; border-radius: 9999px; background: var(--stone); overflow: hidden; }
  .track i { display: block; height: 100%; width: 100%; border-radius: 9999px; background: var(--green); transform: scaleX(0); transform-origin: left center; transition: transform 300ms var(--ease); }
  .drops { display: flex; flex-wrap: wrap; gap: 6px; }
  .drops button { height: 44px; min-width: 56px; padding: 0 14px; border-radius: 30px; border: 1px solid var(--hair); background: transparent; color: var(--muted); font: 12px var(--mono); letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .drops button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

  .sec-h { margin: 28px 20px 4px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sec-h h2 { margin: 0; font: 500 24px/1.2 var(--head); letter-spacing: -0.6px; color: var(--primary); }
  .sec-h span { font-size: 12px; color: var(--slate); }

  .list { padding: 8px 16px 16px; display: flex; flex-direction: column; }
  .bean { border-top: 1px solid var(--hair); scroll-margin-top: 80px; }
  .bean.focus { animation: flash 2s ease-out; }
  @keyframes flash { 0%, 30% { background: var(--coral-bg); } 100% { background: transparent; } }
  .row { width: 100%; min-height: 72px; padding: 14px 4px; border: 0; background: transparent; text-align: left; display: flex; align-items: center; gap: 12px; }
  .row .no { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--slate); width: 38px; flex-shrink: 0; }
  .row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row .nm { font: 400 16px/1.25 var(--display); text-wrap: pretty; overflow-wrap: anywhere; }
  .row .mt { font-size: 12px; color: var(--muted); }
  .st { flex-shrink: 0; display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 30px; border: 1px solid var(--primary); white-space: nowrap; }
  .st.done { background: var(--coral-bg); color: var(--coral-ink); border-color: var(--coral-soft); }
  .panel { padding: 4px 4px 20px 54px; display: flex; flex-direction: column; gap: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: 12px; padding: 3px 10px; border-radius: 30px; border: 1px solid var(--coral-soft); color: var(--coral-ink); background: var(--coral-bg); }
  .facts { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
  .facts a { color: var(--muted); text-underline-offset: 3px; }
  .cap { font-size: 12px; color: var(--slate); }
  .stars { display: flex; margin-left: -6px; }
  .ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; vertical-align: -0.125em; flex-shrink: 0; }
  .ic-fill { fill: currentColor; }
  .ic-sm { width: .9em; height: .9em; }
  .stars button { width: 48px; height: 48px; border: 0; background: transparent; padding: 0; font-size: 30px; line-height: 0; color: var(--field); display: inline-flex; align-items: center; justify-content: center; }
  .stars button.on { color: var(--coral); }
  .stars button.on .ic { fill: currentColor; }
  .st .ic, .scores .val .ic { fill: currentColor; font-size: .85em; margin-right: 3px; }
  .saved { font-size: 12px; color: var(--ok); }
  .saved.err { color: var(--err); }
  .scores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--hair); border-radius: 8px; }
  .scores div { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .scores div + div { border-left: 1px solid var(--soft); }
  .scores .who { font-size: 11px; color: var(--slate); }
  .scores .val { display: flex; align-items: center; font: 500 18px var(--head); font-variant-numeric: tabular-nums; }
  .scores .nt { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
  .note { display: flex; gap: 8px; }
  .note input { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--field); background: var(--bg); color: var(--ink); font-size: 16px; }
  .note input { transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease); }
  .note input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); outline: none; }
  .note button, .btn { height: 44px; padding: 0 18px; border-radius: 32px; border: 0; background: var(--primary); color: var(--on-primary); font-size: 13px; font-weight: 500; }
  .note button[aria-disabled="true"], .stars button[aria-disabled="true"] { opacity: .5; cursor: progress; }

  .hall-row { min-height: 60px; padding: 12px 4px; border-top: 1px solid var(--hair); display: flex; align-items: center; gap: 12px; }
  .hall-row .rk { font-size: 12px; color: var(--slate); width: 18px; }
  .hall-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .hall-row .nm { font: 400 16px var(--display); }
  .hall-row .mt { font-size: 12px; color: var(--muted); }
  .hall-row .av { font: 500 18px var(--head); font-variant-numeric: tabular-nums; }

  .skel { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 14px 4px; border-top: 1px solid var(--hair); }
  .skel i { display: block; height: 12px; border-radius: 6px; background: var(--soft); }
  .skel i:first-child { width: 34px; }
  .skel span { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .skel span i:last-child { width: 45%; }
  .btn-line { height: 44px; padding: 0 18px; border-radius: 30px; border: 1px solid var(--primary); background: transparent; color: var(--primary); font-size: 13px; font-weight: 500; }
  .empty { padding: 32px 4px; text-align: center; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .status { margin: 8px 16px 0; font-size: 12px; color: var(--slate); }
  .status:empty { display: none; }
  footer { margin-top: auto; padding: 56px 20px calc(40px + env(safe-area-inset-bottom)); border-top: 1px solid var(--soft); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  footer .f-logo { font-size: 56px; letter-spacing: -0.04em; }
  footer small { font-size: 12px; color: var(--slate); }
  /* motion: hover only for a fine pointer, press for everyone */
  .drops button, .st, .note button, .stars button, .row { transition: background-color 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease), transform 150ms var(--ease); }
  .drops button:active, .note button:active { transform: translateY(1px) scale(.985); transition-duration: 90ms; }
  .stars button:active { transform: scale(.92); transition-duration: 90ms; }
  @media (hover: hover) and (pointer: fine) {
    .note button:hover { transform: translateY(-1px); background: var(--primary-hover); }
    .drops button:hover { transform: translateY(-1px); border-color: var(--primary); color: var(--primary); }
    .drops button[aria-pressed="true"]:hover { color: var(--on-primary); background: var(--primary-hover); }
    .row:hover .nm { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    .row:hover .st:not(.done) { background: var(--primary); color: var(--on-primary); }
    .stars button:hover { color: var(--coral-soft); }
    .stars button.on:hover { color: var(--coral); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-property: color, background-color, border-color, opacity !important; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <a class="skip" href="#main">원두 목록으로 바로 가기</a>
  <nav>
    <a class="brand" href="#" translate="no">
      <span class="logo" aria-hidden="true">TTCC<i>.</i></span>
      <span class="bar" aria-hidden="true"></span>
      <span class="brand-txt"><span>The Thursday</span> <span>Cupping Club</span></span>
    </a>
    <span class="me-btn" id="meBtn" translate="no" hidden><span class="sr">나: </span><span id="meTxt"></span></span>
  </nav>

  <section class="card-stone" id="picker" hidden aria-labelledby="pickerTitle">
    <div>
      <h2 id="pickerTitle">둘러보는 중이에요</h2>
      <p id="pickerTxt">평가하려면 카톡으로 받은 <b>개인 링크</b>를 한 번 열어주세요. 그 뒤로는 이 폰이 기억해요.</p>
    </div>
  </section>

  <section class="drop" id="dropBox" hidden>
    <h1 translate="no"><span><span id="dropTitle">Drop</span><i aria-hidden="true">.</i></span></h1>
    <p class="meta" id="dropLbl"></p>
    <div class="drop-foot">
      <div class="mine" id="mine">내 평가 <b id="mineN">0/0</b></div>
      <div class="track" aria-hidden="true"><i id="trackFill"></i></div>
    </div>
    <div class="drops" id="drops" aria-label="DROP 고르기"></div>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="sr" id="live" role="status" aria-live="polite"></div>
  <main id="main" tabindex="-1">
    <section aria-labelledby="hLine">
      <div class="sec-h"><h2 id="hLine">Line-up</h2><span id="lineCount" class="num"></span></div>
      <div class="list" id="viewDrop"></div>
    </section>
    <section aria-labelledby="hHall">
      <div class="sec-h"><h2 id="hHall">Hall of Fame</h2><span>2명 이상 평가 · 평균 순</span></div>
      <div class="list" id="viewHall"></div>
    </section>
  </main>

  <footer>
    <span class="logo f-logo" aria-label="TTCC">TTCC<i>.</i></span>
    <small>Since 2026</small>
  </footer>
</div>

<script>
(function () {
  'use strict';
  const API = 'https://script.google.com/macros/s/AKfycbzkUXMN1lVGd1rwpKUJiw7ZeJJJGAlD-EnhEfrC5NwiLdvKotnuZYnJPMtM5LUegQgcrQ/exec';
  const KEY_ME = 'ttcc.me', KEY_DATA = 'ttcc.data', KEY_KEY = 'ttcc.key';
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장 불가 환경 */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } }
  };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => ('0' + n).slice(-2);
  const ICON = {
    star: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9z"/></svg>',
    out: '<svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16 16 8M9.5 8H16v6.5"/></svg>'
  };

  const S = {
    data: null, me: store.get(KEY_ME), tab: 'drop', drop: null, open: null,
    msg: {},            // 원두별 저장 상태 { text, err }
    draft: {},          // 저장 전 감상 (다시 그려도 유지)
    busy: {}            // 원두별 저장 중
  };
  if (S.me && ['IB', 'HJ', 'KC'].indexOf(S.me) < 0) S.me = null;

  // ---------- 개인 링크 (#key=…) ----------
  function takeKey() {
    const km = location.hash.match(/^#key=([0-9a-f]{24})$/);
    if (!km) return false;
    if (km[1] !== store.get(KEY_KEY)) { store.del(KEY_ME); S.me = null; }
    store.set(KEY_KEY, km[1]);
    S.key = km[1]; S.badKey = false;
    history.replaceState(null, '', location.pathname);   // 주소창·공유에 키가 남지 않게
    return true;
  }
  takeKey();
  S.key = store.get(KEY_KEY);
  if (!S.key) S.me = null;                                 // 키 없이 고른 예전 멤버 선택은 무효
  S.badKey = false;

  async function whoami() {
    if (!S.key) return;
    try {
      const r = await fetch(API + '?api=whoami&key=' + S.key, { cache: 'no-store', credentials: 'omit' });
      const d = await r.json();
      if (d.ok) { S.me = d.member; store.set(KEY_ME, S.me); }
      else if (d.error === 'KEY') { S.me = null; S.key = null; S.badKey = true; store.del(KEY_KEY); store.del(KEY_ME); }
    } catch (e) { /* 오프라인: 기억한 멤버로 계속 */ }
    render();
  }

  // ---------- 데이터 ----------
  try { const c = JSON.parse(store.get(KEY_DATA) || 'null'); if (c && c.ok) S.data = c; } catch (e) { /* 캐시 무시 */ }

  async function load(fresh) {
    setStatus(S.data ? '' : '원두 목록 불러오는 중…');
    try {
      const r = await fetch(API + (fresh ? '?fresh=1' : ''), { cache: 'no-store', credentials: 'omit' });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '불러오기 실패');
      S.data = d; S.failed = false;
      store.set(KEY_DATA, JSON.stringify(d));
      setStatus('');
    } catch (e) {
      S.failed = !S.data;
      setStatus(S.data ? '최신 정보를 못 불러와서 저장된 화면을 보여드려요.' : '');
    }
    applyHash();
    render();
  }

  async function send(body) {
    // text/plain 단순 요청 → 미리 확인(preflight) 없이 Apps Script로 전송
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(body), credentials: 'omit', redirect: 'follow' });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '저장 실패');
    return d;
  }

  // ---------- 계산 ----------
  const beans = () => (S.data && S.data.beans) || [];
  const drops = () => [...new Set(beans().map((b) => b.drop))].sort((a, b) => b - a);
  const curDrop = () => (S.drop && drops().indexOf(S.drop) >= 0 ? S.drop : drops()[0]);
  const inDrop = (d) => beans().filter((b) => b.drop === d);
  const myScore = (b) => (S.me && b.ratings[S.me] ? b.ratings[S.me].score : 0);
  const avgOf = (b) => { const v = Object.values(b.ratings).map((r) => r.score); return v.length ? v.reduce((a, c) => a + c, 0) / v.length : null; };
  const daysSince = (iso) => { if (!iso) return null; const t = new Date(iso + 'T00:00:00+09:00'); const n = Math.floor((Date.now() - t.getTime()) / 86400000); return n >= 0 ? n : null; };
  const metaOf = (b) => {
    const parts = [b.country || (b.roaster ? '' : '원두 정보 채우는 중')].filter(Boolean);
    if (b.roaster) parts.unshift(b.roaster);
    const d = daysSince(b.roast);
    if (d != null) parts.push('로스팅 +' + d + '일');
    return parts.join(' · ');
  };

  // ---------- 그리기 ----------
  function setStatus(t) { $('#status').textContent = t; }
  function announce(t) { const el = $('#live'); el.textContent = ''; setTimeout(() => { el.textContent = t; }, 50); }
  const fmtNum = new Intl.NumberFormat('ko-KR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fmtDay = new Intl.DateTimeFormat('ko-KR', { month: 'numeric', day: 'numeric', timeZone: 'Asia/Seoul' });
  const dayText = (iso) => {
    const parts = fmtDay.formatToParts(new Date(iso + 'T12:00:00+09:00'));
    const v = (t) => (parts.find((x) => x.type === t) || {}).value || '';
    return pad(v('month')) + '.' + pad(v('day'));
  };

  // 다시 그려도 포커스·입력 위치 유지
  function focusKey(el) {
    if (!el || el === document.body) return null;
    if (el.id && el.id.indexOf('n-') === 0) return { sel: '#' + el.id, caret: el.selectionStart };
    const d = el.dataset || {};
    if (d.rate) return { sel: '[data-rate="' + d.rate + '"][data-n="' + d.n + '"]' };
    if (d.note) return { sel: '[data-note="' + d.note + '"]' };
    if (d.open) return { sel: '[data-open="' + d.open + '"]' };
    if (d.drop) return { sel: '[data-drop="' + d.drop + '"]' };
    if (d.me) return { sel: '[data-me="' + d.me + '"]' };
    return null;
  }
  function restoreFocus(k) {
    if (!k) return;
    const el = document.querySelector(k.sel);
    if (!el) return;
    el.focus({ preventScroll: true });
    if (k.caret != null && el.setSelectionRange) el.setSelectionRange(k.caret, k.caret);
  }

  function render() {
    const fk = focusKey(document.activeElement);
    paint();
    restoreFocus(fk);
  }

  function paint() {
    // 멤버
    $('#picker').hidden = !!S.me;
    $('#meBtn').hidden = !S.me;
    $('#meTxt').textContent = S.me || '';
    if (S.badKey) $('#pickerTxt').textContent = '이 개인 링크는 더 이상 쓸 수 없어요. 새 링크를 받아 열어주세요.';

    // DROP 박스
    const d = curDrop();
    const list = d ? inDrop(d) : [];
    $('#dropBox').hidden = !d;
    if (d) {
      const isLatest = d === drops()[0];
      const arrived = list.map((b) => b.arrived).filter(Boolean).sort()[0];
      $('#dropLbl').textContent = [isLatest ? '최신' : '지난 DROP', arrived ? dayText(arrived) + ' 도착' : ''].filter(Boolean).join(' · ');
      $('#dropTitle').textContent = 'Drop ' + pad(d);
      const done = S.me ? list.filter((b) => myScore(b)).length : 0;
      $('#mineN').textContent = done + '/' + list.length;
      $('#trackFill').style.transform = 'scaleX(' + (list.length ? done / list.length : 0) + ')';
      $('#drops').hidden = drops().length < 2;
      $('#drops').innerHTML = drops().map((x) => `<button type="button" aria-pressed="${x === d}" data-drop="${x}">${pad(x)}</button>`).join('');
    }

    $('#lineCount').textContent = list.length ? list.length + '봉' : '';

    renderDrop(list);
    renderHall();
  }

  function renderDrop(list) {
    const el = $('#viewDrop');
    if (!S.data) {
      el.innerHTML = S.failed
        ? '<div class="empty"><span>원두 목록을 불러오지 못했어요.</span><button type="button" class="btn-line" data-retry="1">다시 불러오기</button></div>'
        : '<div aria-hidden="true">' + '<div class="skel"><i></i><span><i></i><i></i></span></div>'.repeat(3) + '</div>';
      return;
    }
    if (!list.length) {
      el.innerHTML = '<div class="empty"><span>첫 DROP을 기다리는 중이에요.</span><span>원두가 도착하면 여기에 올라와요.</span></div>';
      return;
    }
    el.innerHTML = list.map((b) => {
      const mine = myScore(b);
      const open = S.open === b.id;
      const status = !S.me ? '보기' : mine ? ICON.star + mine : '평가하기';
      const others = ['IB', 'HJ', 'KC'].filter((w) => w !== S.me && b.ratings[w]).length;
      const msg = S.msg[b.id];
      const facts = [
        b.origin && esc(b.origin),
        b.varieties.length && esc(b.varieties.join(' · ')),
        b.process && esc(b.process),
        /^https:\/\//i.test(b.url || '') && `<a href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">상품 페이지 ${ICON.out}<span class="sr"> (새 창)</span></a>`
      ].filter(Boolean).map((x) => `<span>${x}</span>`).join('');
      let panel = '';
      if (open) {
        panel = `<div class="panel" id="p-${b.id}">
          ${b.notes.length ? `<div class="chips">${b.notes.map((n) => `<span>${esc(n)}</span>`).join('')}</div>` : ''}
          ${facts ? `<div class="facts">${facts}</div>` : ''}
          ${!S.me ? '<div class="cap">개인 링크로 열면 평가할 수 있어요.</div>' : `
            <div style="display:flex;flex-direction:column;gap:6px">
              <div class="cap">내 점수 · ${S.me}</div>
              <div class="stars" role="radiogroup" aria-label="별점">
                ${[1, 2, 3, 4, 5].map((n) => `<button type="button" role="radio" aria-checked="${n === mine}" aria-label="${n}점" class="${n <= mine ? 'on' : ''}" data-rate="${b.id}" data-n="${n}" aria-disabled="${!!S.busy[b.id]}">${ICON.star}</button>`).join('')}
              </div>
            </div>
            ${msg ? `<div class="saved ${msg.err ? 'err' : ''}">${esc(msg.text)}</div>` : ''}
            ${mine ? `
              <div class="scores">${['IB', 'HJ', 'KC'].map((w) => {
                const r = b.ratings[w];
                return `<div><span class="who mono" translate="no">${w}${w === S.me ? ' (나)' : ''}</span><span class="val">${r ? ICON.star + r.score : '<span aria-label="아직 없음">–</span>'}</span>${r && r.note ? `<span class="nt">${esc(r.note)}</span>` : ''}</div>`;
              }).join('')}</div>
              <label style="display:flex;flex-direction:column;gap:6px">
                <span class="cap">한 줄 감상 (선택)</span>
                <span class="note">
                  <input type="text" name="note" autocomplete="off" enterkeyhint="done" maxlength="300" id="n-${b.id}" placeholder="예: 식으면서 복숭아가 올라옴…" value="${esc(S.draft[b.id] != null ? S.draft[b.id] : ((b.ratings[S.me] || {}).note || ''))}">
                  <button type="button" data-note="${b.id}" aria-disabled="${!!S.busy[b.id]}">${S.busy[b.id] ? '저장 중…' : '저장'}</button>
                </span>
              </label>`
            : `<div class="cap">블라인드 커핑: 내 점수를 남기면 다른 멤버 점수가 열려요. (${others}명 평가함)</div>`}`}
        </div>`;
      }
      return `<article class="bean" id="b-${b.id}">
        <button type="button" class="row" aria-expanded="${open}" aria-controls="p-${b.id}" data-open="${b.id}">
          <span class="no mono">${esc(b.no)}</span>
          <span class="tx"><span class="nm" translate="no">${esc(b.name)}</span><span class="mt">${esc(metaOf(b))}</span></span>
          <span class="st ${mine ? 'done' : ''}"${mine ? ` aria-label="내 점수 ${mine}점"` : ''}>${status}</span>
        </button>${panel}
      </article>`;
    }).join('');
  }

  function renderHall() {
    const el = $('#viewHall');
    const ranked = beans()
      .filter((b) => Object.keys(b.ratings).length >= 2)
      .map((b) => ({ b, avg: avgOf(b) }))
      .sort((x, y) => y.avg - x.avg || Object.keys(y.b.ratings).length - Object.keys(x.b.ratings).length)
      .slice(0, 10);
    el.innerHTML = (ranked.length
      ? ranked.map((x, i) => `<div class="hall-row">
          <span class="rk mono num">${i + 1}</span>
          <span class="tx"><span class="nm" translate="no">${esc(x.b.name)}</span><span class="mt">${[`DROP ${pad(x.b.drop)}`, x.b.roaster, x.b.country, Object.keys(x.b.ratings).length + '명'].filter(Boolean).map(esc).join(' · ')}</span></span>
          <span class="av">${fmtNum.format(x.avg)}</span>
        </div>`).join('')
      : '<div class="empty">두 명 이상 평가한 원두가 생기면 여기에 올라와요.</div>');
  }

  // ---------- 동작 ----------
  async function rate(id, n, note) {
    const b = beans().find((x) => x.id === id);
    if (!b || !S.me || S.busy[id]) return;
    const prev = b.ratings[S.me] ? Object.assign({}, b.ratings[S.me]) : null;
    b.ratings[S.me] = { score: n, note: note != null ? note : (prev ? prev.note : '') };
    S.busy[id] = true;
    S.msg[id] = { text: '저장 중…' };
    render();
    try {
      await send({ bean: id, key: S.key, member: S.me, score: n, note: note });
      S.msg[id] = { text: note != null ? '✓ 감상까지 저장됐어요' : '✓ 저장됐어요 · 다시 누르면 바뀌어요' };
      if (note != null) delete S.draft[id];
      store.set(KEY_DATA, JSON.stringify(S.data));
      announce(b.name + ' ' + n + '점' + (note != null ? ', 감상' : '') + ' 저장됨');
    } catch (e) {
      if (prev) b.ratings[S.me] = prev; else delete b.ratings[S.me];
      console.warn('TTCC 저장 실패:', e);
      const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
      if (/KEY/.test(e.message)) { S.badKey = true; S.me = null; S.key = null; store.del(KEY_KEY); store.del(KEY_ME); }
      S.msg[id] = { text: S.badKey ? '개인 링크가 바뀌었어요. 새 링크로 다시 열어주세요.' : offline ? '인터넷 연결을 확인하고 다시 눌러주세요.' : '저장하지 못했어요. 잠시 후 다시 눌러주세요.', err: true };
      announce('저장하지 못했어요. 다시 눌러주세요.');
    }
    S.busy[id] = false;
    render();
  }

  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('button, a');
    if (!t) return;
    if (t.dataset.retry) { S.failed = false; render(); load(true); return; }
    if (t.dataset.drop) { S.drop = Number(t.dataset.drop); S.open = null; history.replaceState(null, '', '#d-' + S.drop); render(); return; }
    if (t.dataset.open) {
      S.open = S.open === t.dataset.open ? null : t.dataset.open;
      history.replaceState(null, '', S.open ? '#b-' + S.open : (S.drop ? '#d-' + S.drop : location.pathname));
      render();
      return;
    }
    if (t.dataset.rate) { rate(t.dataset.rate, Number(t.dataset.n)); return; }
    if (t.dataset.note) {
      const id = t.dataset.note;
      const b = beans().find((x) => x.id === id);
      const v = S.draft[id] != null ? S.draft[id] : (($('#n-' + id) || {}).value || '');
      if (b && myScore(b)) rate(id, myScore(b), v.trim());
    }
  });
  document.addEventListener('input', (ev) => {
    const id = ev.target.id || '';
    if (id.indexOf('n-') === 0) S.draft[id.slice(2)] = ev.target.value;
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.id && ev.target.id.indexOf('n-') === 0) {
      const btn = document.querySelector('[data-note="' + ev.target.id.slice(2) + '"]');
      if (btn) btn.click();
    }
  });

  // #b-<원두ID>로 열면 그 원두를 펼침 (노션 '별점 링크')
  function applyHash() {
    const dm = location.hash.match(/^#d-(\d+)$/);
    if (dm) { S.drop = Number(dm[1]); return; }
    const m = location.hash.match(/^#b-([0-9a-f]{32})$/);
    if (!m) return;
    const b = beans().find((x) => x.id === m[1]);
    if (!b) return;
    S.drop = b.drop; S.open = b.id;
    requestAnimationFrame(() => {
      const el = document.getElementById('b-' + b.id);
      if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('focus'); }
    });
  }
  window.addEventListener('hashchange', () => { if (takeKey()) { whoami(); return; } applyHash(); render(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.data) load(false); });

  if (S.data) { applyHash(); render(); }
  load(true);
  whoami();
})();
</script>
</body>
</html>
