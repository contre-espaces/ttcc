<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500&family=Space+Grotesk:wght@400&family=Inter:opsz,wght@14..32,400;14..32,500&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
  /* Type & palette: Airtable DESIGN.md (Inter for Haas, signature coral/peach/mint/yellow/cream).
     Components: shadcn/ui anatomy (Card, Badge, Button default/outline, Toggle, Input) with shadcn token names.
     Surface: frosted glass over a warm coffee gradient. */
  :root {
    --foreground: #1c1712; --card-foreground: #1c1712; --muted-foreground: #574b43; --slate: #594d44;
    --primary: #1c1712; --primary-foreground: #fffaf5; --primary-press: #0d0a07;
    --border: rgba(255,255,255,.7); --input: rgba(92,80,72,.42); --ring: rgba(170,45,0,.35); --hair: rgba(28,23,18,.10);
    --glass: rgba(255,250,245,.58); --glass-strong: rgba(255,250,245,.88); --glass-sub: rgba(255,255,255,.45);
    --glass-edge: rgba(255,255,255,.75); --glass-hi: inset 0 1px 0 rgba(255,255,255,.85);
    --glass-shadow: 0 1px 2px rgba(90,40,10,.06), 0 12px 32px -8px rgba(120,50,15,.22);
    --bg-base: #f3e3d3;
    --bg-art: radial-gradient(60% 45% at 12% 8%, #fcd2ae 0%, transparent 70%),
              radial-gradient(55% 40% at 95% 22%, #f39a63 0%, transparent 72%),
              radial-gradient(70% 50% at 20% 80%, #e9b68e 0%, transparent 70%),
              radial-gradient(60% 45% at 90% 95%, #d9784a 0%, transparent 70%),
              linear-gradient(180deg, #f6e8da 0%, #efd3bb 100%);
    --coral: #aa2d00; --peach: #fcab79; --mint: #a8d8c4; --yellow: #f4d35e; --cream: #f5e9d4;
    --dot: #aa2d00; --star: #aa2d00; --star-off: rgba(92,80,72,.32);
    --ok: #1d6b3a; --err: #b30000; --focus: #1b61c9; --placeholder: #6f6359;
    --sig-ink: #1c1712; --radius: 16px;
    --ease: cubic-bezier(.2,.8,.2,1);
    --font: 'Inter', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --foreground: #fbf3ec; --card-foreground: #fbf3ec; --muted-foreground: #d7c6b8; --slate: #c2ae9e;
      --primary: #fff6ee; --primary-foreground: #1c1009; --primary-press: #e8d9cc;
      --border: rgba(255,255,255,.16); --input: rgba(255,240,228,.32); --ring: rgba(252,171,121,.4); --hair: rgba(255,255,255,.10);
      --glass: rgba(255,236,220,.08); --glass-strong: rgba(36,18,9,.82); --glass-sub: rgba(255,236,220,.06);
      --glass-edge: rgba(255,255,255,.16); --glass-hi: inset 0 1px 0 rgba(255,255,255,.14);
      --glass-shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -12px rgba(0,0,0,.6);
      --bg-base: #1e120b;
      --bg-art: radial-gradient(60% 40% at 15% 6%, #7a3a17 0%, transparent 72%),
                radial-gradient(55% 40% at 95% 30%, #a2481b 0%, transparent 70%),
                radial-gradient(70% 50% at 10% 85%, #4a2312 0%, transparent 70%),
                radial-gradient(60% 45% at 85% 95%, #6b2c10 0%, transparent 72%),
                linear-gradient(180deg, #2a160c 0%, #170d08 100%);
      --dot: #fcab79; --star: #fcab79; --star-off: rgba(255,240,228,.24);
      --ok: #7fe0a5; --err: #ff9a8e; --focus: #8fb8ff; --placeholder: #b9a595;
    }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; -webkit-text-size-adjust: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; background: var(--bg-base); }
  body { margin: 0; color: var(--foreground); font: 14px/1.45 var(--font); font-optical-sizing: auto; background: transparent; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--bg-art), var(--bg-base); }
  button { font: inherit; cursor: pointer; color: inherit; }
  input { font: inherit; caret-color: var(--coral); }
  input::placeholder { color: var(--placeholder); }
  a { color: var(--foreground); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  ::selection { background: var(--peach); color: #1c1712; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .skip { position: absolute; left: 12px; top: -60px; z-index: 10; padding: 12px 16px; min-height: 44px; border-radius: 12px; background: var(--primary); color: var(--primary-foreground); font-size: 14px; font-weight: 500; text-decoration: none; }
  .skip:focus { top: 8px; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  main:focus { outline: none; }
  .num, .mono { font-variant-numeric: tabular-nums; }
  h1, h2 { text-wrap: balance; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* glass primitive (shadcn Card surface) */
  .glass, nav, .card-stone, .list, .scores, .me-btn, .st, .btn-line, .note input {
    background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--glass-hi), var(--glass-shadow);
    -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
  }

  /* nav: floating glass bar */
  nav { -webkit-backdrop-filter: blur(28px) saturate(170%); backdrop-filter: blur(28px) saturate(170%); }
  nav { position: sticky; top: 8px; z-index: 5; margin: 8px 8px 0; height: 68px; padding: 0 12px 0 16px; gap: 12px; display: flex; align-items: center; justify-content: space-between; border-radius: 20px; background: var(--glass-strong); }
  .brand { display: flex; align-items: center; gap: 12px; min-height: 44px; min-width: 0; text-decoration: none; }
  .logo { font-family: 'Google Sans', var(--font); font-weight: 500; font-size: 34px; line-height: 1; letter-spacing: -0.04em; color: var(--primary); }
  .logo i { font-style: normal; color: var(--dot); }
  .bar { width: 1px; height: 34px; background: var(--hair); flex-shrink: 0; }
  .brand-txt { display: flex; flex-direction: column; min-width: 0; font: 400 16px/1.2 'Space Grotesk', var(--font); letter-spacing: -0.01em; color: var(--primary); white-space: nowrap; }
  .me-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; font-size: 14px; font-weight: 500; flex-shrink: 0; background: var(--glass-sub); box-shadow: var(--glass-hi); }

  /* view-only notice: mint-tinted glass */
  .card-stone { margin: 12px 12px 0; padding: 18px 20px; border-radius: var(--radius); display: flex; flex-direction: column; gap: 4px;
    background: linear-gradient(140deg, rgba(168,216,196,.85), rgba(168,216,196,.6)); color: var(--sig-ink); }
  .card-stone h2 { margin: 0; font-size: 16px; font-weight: 500; }
  .card-stone p { margin: 0; font-size: 14px; color: #1f3d33; }

  /* Drop: glossy coral glass card */
  .drop { position: relative; overflow: hidden; isolation: isolate; margin: 12px 12px 0; padding: 28px 22px 22px; border-radius: 22px; color: #fff; display: flex; flex-direction: column; gap: 18px;
    background: linear-gradient(150deg, #ec5a24 0%, #c43a08 38%, #8e2400 72%, #521404 100%);
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 18px 40px -14px rgba(170,45,0,.6), 0 2px 6px rgba(80,20,0,.18); }
  .drop::before { content: ""; position: absolute; z-index: -1; inset: -40% 30% 40% -30%; background: radial-gradient(closest-side, rgba(255,214,170,.38), transparent); filter: blur(8px); }
  .drop::after { content: ""; position: absolute; z-index: -1; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.14), transparent 38%); pointer-events: none; }
  .drop .meta { margin: -8px 0 0; font-size: 14px; color: #fff; font-variant-numeric: tabular-nums; }
  .drop h1 { margin: 0; font: 500 72px/1 var(--font); letter-spacing: -0.035em; color: #fff; text-shadow: 0 2px 18px rgba(80,15,0,.25); }
  .drop h1 i { font-style: normal; color: var(--peach); }
  @media (max-width: 359px) { .drop h1 { font-size: 60px; } }
  .drop-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .drop .mine { font-size: 14px; color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .drop .mine b { font-weight: 500; color: #fff; }
  /* shadcn Progress */
  .track { flex: 0 1 180px; height: 8px; border-radius: 9999px; background: rgba(255,255,255,.22); box-shadow: inset 0 1px 2px rgba(60,10,0,.25); overflow: hidden; }
  .track i { display: block; height: 100%; width: 100%; border-radius: 9999px; background: linear-gradient(90deg, #ffe2c8, #fff); box-shadow: 0 0 12px rgba(255,220,190,.8); transform: scaleX(0); transform-origin: left center; transition: transform 300ms var(--ease); }
  /* shadcn ToggleGroup on glass */
  .drops { display: flex; flex-wrap: wrap; gap: 8px; }
  .drops button { height: 40px; min-width: 64px; padding: 0 16px; border-radius: 9999px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); position: relative; }
  .drops button::after { content: ""; position: absolute; inset: -3px 0; }
  .drops button[aria-pressed="true"] { background: rgba(255,255,255,.95); color: #8e2400; border-color: #fff; }

  /* section header (shadcn CardHeader outside card) */
  .sec-h { margin: 32px 22px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sec-h h2 { margin: 0; font: 500 22px/1.2 var(--font); letter-spacing: -0.01em; color: var(--primary); }
  .sec-h span { font-size: 13px; color: var(--slate); }

  /* lists live inside a glass Card */
  .list { margin: 0 12px; padding: 4px 14px; border-radius: var(--radius); display: flex; flex-direction: column; }
  .bean { border-top: 1px solid var(--hair); scroll-margin-top: 92px; }
  .bean:first-child { border-top: 0; }
  .bean.focus { animation: flash 2s ease-out; }
  @keyframes flash { 0%, 30% { background: rgba(252,171,121,.28); } 100% { background: transparent; } }
  .row { width: 100%; min-height: 76px; padding: 16px 2px; border: 0; background: transparent; text-align: left; display: flex; align-items: center; gap: 12px; }
  .row .no { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 500; color: var(--slate); width: 40px; flex-shrink: 0; }
  .row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row .nm { font: 500 16px/1.3 var(--font); color: var(--primary); text-wrap: pretty; overflow-wrap: anywhere; }
  .row .mt, .hall-row .mt { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; }
  .row .mt { font-size: 13px; color: var(--muted-foreground); }
  /* 로스터리 라벨 (shadcn Badge) */
  .rt { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 9999px; font-size: 11px; font-weight: 500; letter-spacing: .01em; color: #1c1712;
    background: color-mix(in srgb, var(--rt) 92%, transparent); border: 1px solid rgba(255,255,255,.55); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); white-space: nowrap; }
  /* 로스터리 분류 칩 (shadcn ToggleGroup, 유리) */
  .rfil { margin: 0 0 10px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 12px; scroll-padding: 0 12px; }
  .rfil::-webkit-scrollbar { display: none; }
  .rfil button { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 9999px; font-size: 14px; font-weight: 500; color: var(--primary);
    background: var(--glass-sub); border: 1px solid var(--glass-edge); box-shadow: var(--glass-hi); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .rfil button i { width: 8px; height: 8px; border-radius: 50%; background: var(--rt); box-shadow: 0 0 0 1px rgba(28,23,18,.15); }
  .rfil button b { font-weight: 400; opacity: .7; }
  .rfil button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  .rfil button:active { transform: scale(.97); }
  /* shadcn Button outline (glass) / Badge */
  .st { flex-shrink: 0; display: inline-flex; align-items: center; height: 36px; font-size: 13px; font-weight: 500; padding: 0 14px; border-radius: 9999px; color: var(--primary); white-space: nowrap; background: var(--glass-sub); }
  .st.done { background: linear-gradient(140deg, #ffc9a2, #fca06a); color: var(--sig-ink); border-color: rgba(255,255,255,.6); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 6px 16px -6px rgba(240,120,60,.55); }
  .panel { padding: 0 2px 22px 54px; display: flex; flex-direction: column; gap: 16px; }
  /* flavour notes: shadcn Badge in the signature palette, slightly translucent glass */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: 13px; font-weight: 500; padding: 5px 11px; border-radius: 9999px; color: var(--sig-ink); background: rgba(252,171,121,.88); border: 1px solid rgba(255,255,255,.55); box-shadow: inset 0 1px 0 rgba(255,255,255,.55); }
  .chips span:nth-child(4n+2) { background: rgba(168,216,196,.9); }
  .chips span:nth-child(4n+3) { background: rgba(244,211,94,.9); }
  .chips span:nth-child(4n+4) { background: rgba(245,233,212,.92); }
  .facts { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted-foreground); }
  .facts a { color: var(--foreground); font-weight: 500; }
  .cap { font-size: 13px; color: var(--slate); }
  .stars { display: flex; margin-left: -6px; }
  .ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; vertical-align: -0.125em; flex-shrink: 0; }
  .ic-fill { fill: currentColor; }
  .ic-sm { width: .9em; height: .9em; }
  .stars button { width: 48px; height: 48px; border: 0; background: transparent; padding: 0; font-size: 30px; line-height: 0; color: var(--star-off); display: inline-flex; align-items: center; justify-content: center; }
  .stars button.on { color: var(--star); filter: drop-shadow(0 3px 8px rgba(240,110,40,.45)); }
  .stars button.on .ic { fill: currentColor; }
  .st .ic, .scores .val .ic { fill: currentColor; font-size: .85em; margin-right: 4px; }
  .scores .val .ic { color: var(--star); }
  .saved { font-size: 13px; color: var(--ok); }
  .saved.err { color: var(--err); }
  .scores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: 14px; background: var(--glass-sub); box-shadow: var(--glass-hi); }
  .scores div { padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .scores div + div { border-left: 1px solid var(--hair); }
  .scores .who { font-size: 12px; font-weight: 500; color: var(--slate); }
  .scores .val { display: flex; align-items: center; font: 500 20px var(--font); font-variant-numeric: tabular-nums; color: var(--primary); }
  .scores .nt { font-size: 12px; color: var(--muted-foreground); overflow-wrap: anywhere; }
  /* shadcn Input + Button default */
  .note { display: flex; gap: 8px; }
  .note input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border-radius: 12px; border-color: var(--input); background: var(--glass-sub); color: var(--foreground); font-size: 16px; box-shadow: var(--glass-hi); transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease); }
  .note input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px var(--ring); outline: none; }
  .note button, .btn { height: 44px; padding: 0 20px; border-radius: 12px; border: 0; background: var(--primary); color: var(--primary-foreground); font-size: 14px; font-weight: 500; box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 8px 20px -8px rgba(30,15,5,.45); }
  .note button[aria-disabled="true"], .stars button[aria-disabled="true"] { opacity: .5; cursor: progress; }

  /* TTCC에 담기 (레이더에서 넘어온 원두) */
  .add-card { margin: 12px 12px 0; padding: 20px; border-radius: 20px; display: flex; flex-direction: column; gap: 16px;
    background: var(--glass-strong); border: 1px solid var(--glass-edge); box-shadow: var(--glass-hi), var(--glass-shadow);
    -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); }
  .add-card h2 { margin: 0; font: 500 18px/1.2 var(--font); color: var(--primary); }
  .add-card .bean-nm { font: 500 20px/1.25 var(--font); color: var(--primary); overflow-wrap: anywhere; }
  .add-card .bean-mt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13px; color: var(--muted-foreground); }
  .add-card .msg { margin: 0; font-size: 14px; color: var(--muted-foreground); }
  .add-card .msg.err { color: var(--err); }
  .add-card .msg.ok { color: var(--ok); }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field .lbl { font-size: 13px; font-weight: 500; color: var(--slate); }
  .pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .pick button { min-height: 64px; padding: 10px 14px; border-radius: 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; justify-content: center;
    background: var(--glass-sub); border: 1px solid var(--glass-edge); box-shadow: var(--glass-hi); color: var(--primary); }
  .pick button b { font-size: 16px; font-weight: 500; }
  .pick button small { font-size: 12px; color: var(--muted-foreground); }
  .pick button[aria-checked="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); box-shadow: 0 6px 16px -8px rgba(30,15,5,.5); }
  .pick button[aria-checked="true"] small { color: inherit; opacity: .75; }
  .pick button:only-child { grid-column: 1 / -1; }
  .more-link { align-self: flex-start; min-height: 44px; padding: 0 2px; border: 0; background: none; font-size: 13px; font-weight: 500; color: var(--muted-foreground); text-decoration: underline; text-underline-offset: 3px; }
  .older { display: flex; flex-wrap: wrap; gap: 6px; }
  .older button { min-width: 52px; height: 40px; border-radius: 9999px; font-size: 14px; font-weight: 500; color: var(--primary); background: var(--glass-sub); border: 1px solid var(--glass-edge); }
  .older button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  .seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--glass-sub); border: 1px solid var(--glass-edge); }
  .seg button { height: 44px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; font-weight: 500; color: var(--muted-foreground); }
  .seg button[aria-checked="true"] { background: var(--primary); color: var(--primary-foreground); box-shadow: 0 4px 12px -6px rgba(30,15,5,.5); }
  .add-act { display: flex; gap: 8px; }
  .add-act .btn, .add-act .btn-line { flex: 1; }
  .radar-link { margin-top: 8px; display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 9999px; font-size: 14px; font-weight: 500; color: var(--primary); text-decoration: none;
    background: var(--glass-sub); border: 1px solid var(--glass-edge); box-shadow: var(--glass-hi); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }

  /* Hall of Fame: cream-tinted glass card */
  #viewHall { background: linear-gradient(150deg, rgba(245,233,212,.88), rgba(245,233,212,.66)); color: var(--sig-ink); border-color: rgba(255,255,255,.7); }
  .hall-row { min-height: 64px; padding: 14px 2px; border-top: 1px solid rgba(28,23,18,.12); display: flex; align-items: center; gap: 12px; }
  .hall-row:first-child { border-top: 0; }
  .hall-row .rk { font-size: 14px; font-weight: 500; color: var(--coral); width: 18px; font-variant-numeric: tabular-nums; }
  .hall-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .hall-row .nm { font: 500 16px/1.3 var(--font); }

  .skel { display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 16px 2px; border-top: 1px solid var(--hair); }

  .empty { padding: 32px 4px; text-align: center; color: var(--muted-foreground); font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .status { margin: 12px 22px 0; font-size: 13px; color: var(--slate); }

  footer { margin-top: 40px; padding: 48px 20px calc(40px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }

  /* motion: press states */
  .drops button, .st, .note button, .stars button, .btn-line { transition: background-color 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease), transform 150ms var(--ease); }
  .drops button:active, .note button:active, .btn-line:active, .st:active { transform: scale(.97); transition-duration: 90ms; }
  .note button:active { background: var(--primary-press); }
  .stars button:active { transform: scale(.9); transition-duration: 90ms; }

  /* no blur support or user asks for less transparency: solid surfaces, same layout */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --glass: rgba(255,250,245,.94); --glass-strong: rgba(255,250,245,.97); --glass-sub: rgba(255,255,255,.7); }
  }
  @media (prefers-reduced-transparency: reduce) {
    :root { --glass: #fbf4ee; --glass-strong: #fbf4ee; --glass-sub: #ffffff; }

  }
  @media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: dark) {
    :root { --glass: #2a1a11; --glass-strong: #2a1a11; --glass-sub: #332116; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-property: color, background-color, border-color, opacity !important; }
  }
  [hidden] { display: none !important; }

  /* tasteskill 정리: 칩·링크도 손가락 44px, 버튼은 올리면 살짝 뜨고 누르면 들어감, 정보 줄에는 이름표 */
  .rfil button { height: 44px; }
  .facts span { display: flex; gap: 10px; }
  .facts i { font-style: normal; flex: none; width: 40px; color: var(--muted-foreground); opacity: .8; }
  .facts a { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; }
  @media (hover: hover) and (pointer: fine) {
    .drops button:hover, .rfil button:hover, .st:hover, .btn-line:hover, .note button:hover { transform: translateY(-1px); }
  }
  @media (prefers-reduced-motion: reduce) { .drops button, .rfil button, .st, .btn-line, .note button { transition: none; transform: none !important; } }

  /* 원두 정보: 로스터리 설명은 접어 두기 */
  .story { border-top: 1px solid var(--hair); padding-top: 4px; }
  .story > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; font-weight: 500; color: var(--foreground); }
  .story > summary::-webkit-details-marker { display: none; }

  .story[open] > summary::after { content: "−"; }
  .story h4 { margin: 8px 0 4px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); letter-spacing: .02em; }
  .story p { margin: 0 0 8px; font-size: 14px; line-height: 1.7; color: var(--foreground); }
  /* 멤버 감상: 점수 칸과 따로, 읽기 좋은 크기로 */
  .reviews { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .reviews li { padding: 12px 14px; border-radius: 14px; background: var(--glass-sub); box-shadow: var(--glass-hi); display: flex; flex-direction: column; gap: 6px; }
  .rv-who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--slate); }
  .rv-who b { font-weight: 500; color: var(--foreground); }
  .rv-sc { display: inline-flex; align-items: center; gap: 2px; color: var(--star); font-variant-numeric: tabular-nums; }
  .rv-sc .ic { fill: currentColor; font-size: .9em; }
  .reviews p, .story p { word-break: keep-all; overflow-wrap: anywhere; }
  .reviews p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--foreground); overflow-wrap: anywhere; }

  /* ---------- 원두 시트 ---------- */
  .sheet { position: fixed; inset: auto 0 0 0; margin: 0 auto; width: 100%; max-width: 560px; max-height: 92dvh; padding: 0; border: 0; border-radius: 28px 28px 0 0; background: var(--glass-strong); color: var(--foreground); box-shadow: 0 -24px 60px -20px rgba(60,25,5,.45), inset 0 1px 0 rgba(255,255,255,.5); -webkit-backdrop-filter: blur(28px) saturate(1.5); backdrop-filter: blur(28px) saturate(1.5); overflow: hidden; }
  .sheet::backdrop { background: rgba(30,15,5,.36); }
  .sheet[open] { animation: shUp .32s var(--ease); }
  @keyframes shUp { from { transform: translateY(40px); opacity: 0; } }
  @media (min-width: 720px) { .sheet { inset: 0; margin: auto; border-radius: 28px; max-height: 88dvh; } }
  .sh-in { max-height: inherit; overflow-y: auto; overscroll-behavior: contain; padding: 0 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 18px; }
  .sh-grab { width: 40px; height: 5px; border-radius: 9px; background: var(--hair); margin: 10px auto 0; flex: none; }
  @media (min-width: 720px) { .sh-grab { visibility: hidden; height: 4px; } }
  .sh-head { display: flex; align-items: flex-start; gap: 12px; }

  .sh-sub { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--slate); }
  .sh-head h2 { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 500; letter-spacing: -.01em; text-wrap: balance; }
  .sh-x { flex: none; width: 44px; height: 44px; border-radius: 9999px; border: 1px solid var(--hair); background: var(--glass-sub); color: var(--foreground); display: inline-flex; align-items: center; justify-content: center; }
  .sh-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 500; color: var(--foreground); }
  .hint { font-size: 12px; font-weight: 400; color: var(--slate); }

  /* 정보 타일 */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tiles div { padding: 14px 12px; border-radius: 16px; background: var(--glass-sub); box-shadow: var(--glass-hi); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tiles span { font-size: 12px; color: var(--slate); }
  .tiles b { font-size: 15px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; word-break: keep-all; }
  .sh-facts { margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .sh-facts div { display: flex; gap: 12px; }
  .sh-facts dt { flex: none; width: 44px; color: var(--slate); }
  .sh-facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .sh-facts a { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; color: var(--foreground); }

  /* 내 평가 카드: 정보 바로 아래, 코랄로 강조 */
  .rate-card { padding: 18px 16px; border-radius: 22px; background: linear-gradient(160deg, rgba(252,171,121,.28), rgba(252,171,121,.10)); border: 1px solid rgba(170,45,0,.18); display: flex; flex-direction: column; gap: 12px; }
  .rate-card .stars { margin-left: -6px; }
  .felt { display: flex; flex-wrap: wrap; gap: 8px; }
  .felt button { min-height: 44px; padding: 0 14px; border-radius: 9999px; border: 1px solid var(--hair); background: var(--glass-sub); color: var(--foreground); font-size: 14px; position: relative; }
  .felt button::after { content: ""; position: absolute; inset: -2px; }
  .felt button[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); color: #fff; }
  .felt button[aria-pressed="true"]::before { content: "✓ "; }
  .felt-add input { height: 44px; width: 118px; padding: 0 14px; border-radius: 9999px; border: 1px dashed var(--hair); background: transparent; color: var(--foreground); font-size: 16px; }
  .felt-add input:focus { outline: none; border-style: solid; border-color: var(--coral); box-shadow: 0 0 0 3px var(--ring); }
  .memo { display: flex; flex-direction: column; gap: 6px; }
  .memo input { height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--input); background: var(--glass-sub); color: var(--foreground); font-size: 16px; }
  .memo input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px var(--ring); outline: none; }
  .btn.save { width: 100%; }
  .btn.save[aria-disabled="true"] { opacity: .45; cursor: default; }

  /* 멤버 평가: 한 사람씩 아바타 + 별점 + 느낀 노트 + 감상 */
  .club { display: flex; flex-direction: column; gap: 10px; }
  .mates { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .mates li { display: flex; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--glass-sub); box-shadow: var(--glass-hi); }
  .mates li.none { opacity: .55; }
  .mates .av { flex: none; width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; background: var(--peach); color: var(--sig-ink); }
  .mt-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .mt-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
  .mt-top b { font-weight: 500; }
  .mates p { margin: 0; font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
  .mini { display: flex; flex-wrap: wrap; gap: 4px; }
  .mini span { font-size: 12px; padding: 2px 8px; border-radius: 9999px; background: rgba(252,171,121,.45); color: var(--sig-ink); }
  .mini span.own { background: rgba(168,216,196,.7); }
  .blind { padding: 14px; border-radius: 16px; border: 1px dashed var(--hair); text-align: center; }
  @media (prefers-color-scheme: dark) {
    .rate-card { background: linear-gradient(160deg, rgba(255,120,60,.20), rgba(255,120,60,.06)); border-color: rgba(255,140,80,.25); }
    .flow-cap { color: #ffab7a; }
    .flow li.done i, .felt button[aria-pressed="true"] { background: #e8743c; border-color: #e8743c; }
    .mini span { background: rgba(252,171,121,.22); color: #ffd2b5; }
    .mini span.own { background: rgba(168,216,196,.22); color: #c9f0df; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet[open] { animation: none; } }

  /* 맛보기 좋은 때 한 줄 */
  .best { margin: -6px 0 0; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: var(--glass-sub); color: var(--slate); }
  .best::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .best.now { background: rgba(170,45,0,.10); color: var(--coral); }
  /* 평가 카드: 가운데 정렬, 큰 별 + 한 마디 */
  .rate-card { align-items: stretch; text-align: center; padding: 22px 18px; }
  .rc-q { margin: 0; font-size: 15px; font-weight: 500; color: var(--foreground); }
  .rc-q .hint { font-weight: 400; margin-left: 4px; }
  .stars.big { justify-content: center; margin: 0; gap: 4px; }
  .stars.big button { width: 52px; height: 52px; font-size: 40px; }
  .verdict { margin: -4px 0 0; font-size: 17px; font-weight: 500; color: var(--coral); min-height: 24px; }
  .verdict.idle { font-size: 13px; font-weight: 400; color: var(--slate); }
  .rc-sec { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--hair); }
  .rate-card .felt { justify-content: center; }
  .felt.issue button[aria-pressed="true"] { background: var(--slate); border-color: var(--slate); }
  .memo { text-align: left; padding-top: 14px; border-top: 1px solid var(--hair); }
  .memo textarea { min-height: 112px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--input); background: var(--glass-sub); color: var(--foreground); font: 16px/1.6 var(--font); resize: vertical; }
  .memo textarea:focus { border-color: var(--coral); box-shadow: 0 0 0 3px var(--ring); outline: none; }
  .btn.save { height: 52px; border-radius: 9999px; font-size: 15px; background: var(--coral); }
  .rv-sc em { font-style: normal; margin-left: 6px; color: var(--slate); font-size: 12px; }
  .mini span.iss { background: rgba(120,110,100,.18); color: var(--slate); }
  .cmt { white-space: pre-line; }
  @media (prefers-color-scheme: dark) {
    .best.now { background: rgba(255,140,80,.14); color: #ffab7a; }
    .verdict { color: #ffab7a; }
    .btn.save { background: #e8743c; }
    .mini span.iss { background: rgba(255,255,255,.08); color: var(--muted-foreground); }
    .felt.issue button[aria-pressed="true"] { background: rgba(255,240,230,.88); border-color: transparent; color: #2a1a10; }
  }
  .rc-edit { margin: -8px 0 0; }

  /* 지난 DROP: 접힌 한 줄씩 */
  .past { padding: 4px 14px; }
  .past-d + .past-d { border-top: 1px solid var(--hair); }
  .past-h { width: 100%; min-height: 64px; padding: 12px 2px; border: 0; background: transparent; text-align: left; display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 12px; color: var(--foreground); }
  .past-n { font-size: 15px; font-weight: 500; color: var(--primary); }
  .past-s { font-size: 13px; color: var(--slate); min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .past-top { color: var(--foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .past-c { font-size: 20px; color: var(--slate); width: 24px; text-align: center; }
  .past-b { padding-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="skip" href="#main">원두 목록으로 바로 가기</a>
  <nav>
    <a class="brand" href="#" translate="no">
      <span class="logo" aria-hidden="true">TTCC<i>.</i></span>
      <span class="bar" aria-hidden="true"></span>
      <span class="brand-txt"><span>The Thursday</span> <span>Cupping Club</span></span>
    </a>
    <span class="me-btn" id="meBtn" translate="no" hidden><span class="sr">나: </span><span id="meTxt"></span></span>
  </nav>

  <section class="add-card" id="addBox" hidden aria-labelledby="addTitle" aria-live="polite"></section>
  <section class="card-stone" id="picker" hidden aria-labelledby="pickerTitle">
    <div>
      <h2 id="pickerTitle">지금은 구경만 할 수 있어요</h2>
      <p id="pickerTxt">카톡 링크로 들어오면 별점을 남길 수 있어요.</p>
    </div>
  </section>

  <section class="drop" id="dropBox" hidden>
    <h1 translate="no"><span><span id="dropTitle">Drop</span><i aria-hidden="true">.</i></span></h1>
    <p class="meta" id="dropLbl"></p>
    <div class="drop-foot">
      <div class="mine" id="mine">내 평가 <b id="mineN">0/0</b></div>
      <div class="track" aria-hidden="true"><i id="trackFill"></i></div>
    </div>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="sr" id="live" role="status" aria-live="polite"></div>
  <main id="main" tabindex="-1">
    <section aria-labelledby="hLine">
      <div class="sec-h"><h2 id="hLine">라인업</h2><span id="lineCount" class="num"></span></div>
      <div class="rfil" id="rfil" role="group" aria-label="로스터리" hidden></div>
      <div class="list" id="viewDrop"></div>
    </section>
    <section aria-labelledby="hTodo" id="secTodo" hidden>
      <div class="sec-h"><h2 id="hTodo">밀린 평가</h2><span id="todoN"></span></div>
      <div class="list" id="viewTodo"></div>
    </section>
    <section aria-labelledby="hPast" id="secPast" hidden>
      <div class="sec-h"><h2 id="hPast">지난 DROP</h2><span>최신순</span></div>
      <div class="list past" id="viewPast"></div>
    </section>
    <section aria-labelledby="hHall">
      <div class="sec-h"><h2 id="hHall">명예의 전당</h2><span>2명 이상 평가 · 평균 순</span></div>
      <div class="list" id="viewHall"></div>
    </section>
  </main>
  <dialog class="sheet" id="sheet" aria-labelledby="shName"><div class="sh-in" id="shIn"></div></dialog>

  <footer>
    <span class="logo f-logo" aria-label="TTCC">TTCC<i>.</i></span>
    <small>Since 2026</small>
    <a class="radar-link" id="radarLink" href="https://coffee.inbeom.com/#ttcc" hidden>레이더에서 원두 고르기</a>
  </footer>
</div>

<script>
(function () {
  'use strict';
  const API = 'https://script.google.com/macros/s/AKfycbzkUXMN1lVGd1rwpKUJiw7ZeJJJGAlD-EnhEfrC5NwiLdvKotnuZYnJPMtM5LUegQgcrQ/exec';
  const KEY_ME = 'ttcc.me', KEY_DATA = 'ttcc.data', KEY_KEY = 'ttcc.key';
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장 불가 환경 */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } }
  };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => ('0' + n).slice(-2);
  // 가격: 원화는 ₩35,000, 외화는 그 통화로 소수 둘째 자리까지 ($26.50)
  const fmtPrice = (n, cur) => { cur = cur || 'KRW'; try { return new Intl.NumberFormat(cur === 'KRW' ? 'ko-KR' : 'en-US', { style: 'currency', currency: cur, minimumFractionDigits: cur === 'KRW' ? 0 : 2, maximumFractionDigits: cur === 'KRW' ? 0 : 2 }).format(n); } catch (e) { return cur + ' ' + n; } };
  const fmtWon = (n) => { try { return new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW', maximumFractionDigits: 0 }).format(n); } catch (e) { return '₩' + n; } };
  const ICON = {
    star: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9z"/></svg>',
    out: '<svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16 16 8M9.5 8H16v6.5"/></svg>'
  };

  const S = {
    data: null, me: store.get(KEY_ME), tab: 'drop', drop: null, open: null, roaster: 'all',
    msg: {},            // 원두별 저장 상태 { text, err }
    draft: {},          // 저장 전 감상 (다시 그려도 유지)
    felt: {},           // 저장 전 느낀 노트 [원두ID] = ['베르가못', …]
    addNote: {},        // 직접 추가하는 노트 입력값 (S.add는 '레이더에서 담기' 상태라 이름을 따로 씀)
    busy: {}            // 원두별 저장 중
  };
  if (S.me && ['IB', 'HJ', 'KC'].indexOf(S.me) < 0) S.me = null;

  // ---------- 개인 링크 (#key=…) ----------
  function takeKey() {
    const km = location.hash.match(/^#key=([0-9a-f]{24})$/);
    if (!km) return false;
    if (km[1] !== store.get(KEY_KEY)) { store.del(KEY_ME); S.me = null; }
    store.set(KEY_KEY, km[1]);
    S.key = km[1]; S.badKey = false;
    history.replaceState(null, '', location.pathname);   // 주소창·공유에 키가 남지 않게
    return true;
  }
  takeKey();
  S.key = store.get(KEY_KEY);
  if (!S.key) S.me = null;                                 // 키 없이 고른 예전 멤버 선택은 무효
  S.badKey = false;

  async function whoami() {
    if (!S.key) return;
    try {
      const r = await fetch(API + '?api=whoami&key=' + S.key, { cache: 'no-store', credentials: 'omit' });
      const d = await r.json();
      if (d.ok) { S.me = d.member; store.set(KEY_ME, S.me); }
      else if (d.error === 'KEY') { S.me = null; S.key = null; S.badKey = true; store.del(KEY_KEY); store.del(KEY_ME); }
    } catch (e) { /* 오프라인: 기억한 멤버로 계속 */ }
    render();
  }

  // ---------- 데이터 ----------
  try { const c = JSON.parse(store.get(KEY_DATA) || 'null'); if (c && c.ok) S.data = c; } catch (e) { /* 캐시 무시 */ }

  async function load(fresh) {
    setStatus(S.data ? '' : '원두 목록 불러오는 중…');
    try {
      const r = await fetch(API + (fresh ? '?fresh=1' : ''), { cache: 'no-store', credentials: 'omit' });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '불러오기 실패');
      S.data = d; S.failed = false;
      store.set(KEY_DATA, JSON.stringify(d));
      setStatus('');
    } catch (e) {
      S.failed = !S.data;
      setStatus(S.data ? '최신 정보를 못 불러와 저장본을 보여줘요.' : '');
    }
    applyHash();
    render();
  }

  // ---------- 레이더에서 담기 (#add=<상품 주소>) ----------
  const KINDS = ['구독', '추가구매'];
  const ADDERS = ['IB'];   // 레이더에서 담기 (서버도 같은 규칙으로 막음)
  const ADD_ERR = {
    KEY: '멤버 링크로 들어온 폰에서만 담을 수 있어요.',
    NOT_ADDER: '원두 담기는 IB만 할 수 있어요.',
    NOT_IN_RADAR: '레이더에서 찾을 수 없는 원두예요.',
    LIMIT: '오늘은 더 담을 수 없어요. 하루 10개까지예요.',
    DROP: 'DROP 번호를 다시 골라주세요.',
    KIND: '구독·추가구매 중 하나를 골라주세요.'
  };
  function takeAdd() {
    const m = location.hash.match(/^#add=(.+)$/);
    if (!m) return false;
    let url = '';
    try { url = decodeURIComponent(m[1]); } catch (e) { url = ''; }
    history.replaceState(null, '', location.pathname);
    if (!/^https:\/\/[^\s]+$/i.test(url)) return false;
    S.add = { url: url, phase: 'loading' };
    render();
    preview();
    return true;
  }
  async function preview() {
    const a = S.add;
    try {
      const r = await fetch(API + '?api=preview&url=' + encodeURIComponent(a.url), { cache: 'no-store', credentials: 'omit' });
      const d = await r.json();
      if (S.add !== a) return;
      if (!d.ok) throw new Error(d.error || 'fail');
      if (!d.found) { a.phase = 'error'; a.msg = ADD_ERR.NOT_IN_RADAR; }
      else {
        a.item = d.item; a.dup = d.dup;
        a.drop = d.latestDrop || 1;
        a.kind = d.item.sey ? '구독' : '추가구매';
        a.latest = d.latestDrop || 0;
        a.phase = d.dup ? 'dup' : 'ready';
      }
    } catch (e) { if (S.add === a) { a.phase = 'error'; a.msg = '원두 정보를 불러오지 못했어요. 잠시 후 다시 눌러주세요.'; } }
    render();
  }
  async function addBean() {
    const a = S.add;
    if (!a || a.phase !== 'ready' || !S.key) return;
    a.phase = 'saving'; render();
    try {
      const d = await fetch(API, { method: 'POST', body: JSON.stringify({ api: 'add', key: S.key, url: a.url, drop: a.drop, kind: a.kind }), credentials: 'omit', redirect: 'follow' }).then((r) => r.json());
      if (!d.ok && d.error === 'DUP') { a.phase = 'dup'; a.dup = d.id; render(); return; }
      if (!d.ok) throw new Error(d.error || 'fail');
      a.phase = 'done'; a.id = d.id; render();
      announce('TTCC에 담았어요');
      await load(true);
      S.add = null; S.drop = a.drop; S.open = a.id; S.roaster = 'all';
      history.replaceState(null, '', '#b-' + a.id);
      render(); applyHash(); render();
    } catch (e) {
      if (S.add !== a) return;
      if (e.message === 'KEY') { S.badKey = true; S.me = null; S.key = null; store.del(KEY_KEY); store.del(KEY_ME); }
      a.phase = 'ready'; a.err = ADD_ERR[e.message] || '담지 못했어요. 잠시 후 다시 눌러주세요.';
      render();
    }
  }
  // DROP 고르기: '지금 DROP'과 '새 DROP' 두 칸 (지난 DROP은 따로 펼침)
  const countIn = (n) => beans().filter((b) => b.drop === n).length;
  function dropChoices(a) {
    if (!a.latest) return [{ n: 1, sub: '첫 DROP' }];
    return [{ n: a.latest, sub: '지금 · ' + countIn(a.latest) + '봉' }, { n: a.latest + 1, sub: '새로 시작' }];
  }
  function olderDrops(a) { const out = []; for (let n = a.latest - 1; n >= 1; n--) out.push(n); return out; }

  function renderAdd() {
    const el = $('#addBox'), a = S.add && S.add.url ? S.add : null;   // 담을 상품 주소가 있을 때만 (빈 상태로 뜨지 않게)
    el.hidden = !a;
    if (!a) { el.innerHTML = ''; return; }
    const it = a.item;
    const head = '<h2 id="addTitle">TTCC에 담기</h2>';
    const bean = it ? `<div style="display:flex;flex-direction:column;gap:6px">
        <span class="bean-nm" translate="no">${esc(it.name)}</span>
        <span class="bean-mt">${rtTag({ roaster: it.sey ? '' : it.roaster })}<span>${esc([it.country, it.process, it.price ? fmtPrice(it.price, it.currency) : ''].filter(Boolean).join(' · '))}</span></span>
        ${it.notes && it.notes.length ? `<div class="chips">${it.notes.slice(0, 5).map((n) => `<span>${esc(n)}</span>`).join('')}</div>` : ''}
      </div>` : '';
    const close = '<button type="button" class="btn-line" data-addclose="1">닫기</button>';
    let body = '';
    if (a.phase === 'loading') body = '<p class="msg">레이더에서 원두 정보를 불러오는 중…</p>';
    else if (a.phase === 'error') body = `<p class="msg err">${esc(a.msg)}</p><div class="add-act">${close}</div>`;
    else if (a.phase === 'dup') body = `${bean}<p class="msg">이미 TTCC에 담긴 원두예요.</p><div class="add-act">${close}<button type="button" class="btn" data-addgo="${esc(a.dup || '')}">보러 가기</button></div>`;
    else if (!S.key) body = `${bean}<p class="msg">${ADD_ERR.KEY}</p><div class="add-act">${close}</div>`;
    else if (S.me && ADDERS.indexOf(S.me) < 0) body = `${bean}<p class="msg">${ADD_ERR.NOT_ADDER}</p><div class="add-act">${close}</div>`;
    else if (a.phase === 'done') body = `${bean}<p class="msg ok">담았어요. 원두 목록으로 이동해요…</p>`;
    else body = `${bean}
      <div class="field"><span class="lbl" id="dropLblAdd">어느 DROP에 담을까요?</span>
        <div class="pick" role="radiogroup" aria-labelledby="dropLblAdd">${dropChoices(a).map((c) => `<button type="button" role="radio" aria-checked="${a.drop === c.n}" data-adddrop="${c.n}"><b class="num">DROP ${pad(c.n)}</b><small>${esc(c.sub)}</small></button>`).join('')}</div>
        ${a.latest > 1 && !a.other ? '<button type="button" class="more-link" data-addother="1">지난 DROP에 담기</button>' : ''}
        ${a.other ? `<div class="older" role="group" aria-label="지난 DROP">${olderDrops(a).map((n) => `<button type="button" aria-pressed="${a.drop === n}" data-adddrop="${n}" class="num">${pad(n)}</button>`).join('')}</div>` : ''}
      </div>
      <div class="field"><span class="lbl" id="kindLblAdd">구분</span>
      <div class="seg" role="radiogroup" aria-labelledby="kindLblAdd">${KINDS.map((k) => `<button type="button" role="radio" aria-checked="${a.kind === k}" data-addkind="${k}">${k}</button>`).join('')}</div></div>
      ${a.err ? `<p class="msg err">${esc(a.err)}</p>` : ''}
      <div class="add-act"><button type="button" class="btn-line" data-addclose="1">취소</button>
        <button type="button" class="btn" data-addgo="" data-addsave="1"${a.phase === 'saving' ? ' aria-disabled="true"' : ''}>${a.phase === 'saving' ? '담는 중…' : `DROP ${pad(a.drop)}에 담기`}</button></div>`;
    el.innerHTML = head + body;
  }

  async function send(body) {
    // text/plain 단순 요청 → 미리 확인(preflight) 없이 Apps Script로 전송
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(body), credentials: 'omit', redirect: 'follow' });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '저장 실패');
    return d;
  }

  // ---------- 계산 ----------
  const beans = () => (S.data && S.data.beans) || [];
  const drops = () => [...new Set(beans().map((b) => b.drop))].sort((a, b) => b - a);
  const curDrop = () => drops()[0];   // 맨 위 카드·라인업은 항상 최신 DROP (S.drop은 펼친 지난 DROP)
  const inDrop = (d) => beans().filter((b) => b.drop === d);
  const myScore = (b) => (S.me && b.ratings[S.me] ? b.ratings[S.me].score : 0);
  const avgOf = (b) => { const v = Object.values(b.ratings).map((r) => r.score); return v.length ? v.reduce((a, c) => a + c, 0) / v.length : null; };
  const daysSince = (iso) => { if (!iso) return null; const t = new Date(iso + 'T00:00:00+09:00'); const n = Math.floor((Date.now() - t.getTime()) / 86400000); return n >= 0 ? n : null; };
  // 로스터리 라벨: 노션 '로스터리' 칸이 비어 있으면 SEY. 이름마다 늘 같은 색
  // 생산자 칸: 원두명에 이미 들어 있는 이름은 빼고 (생산자 또는 농장만)
  const prodOf = (b) => { const nm = String(b.name || '').toLowerCase(); return [b.producer, b.farm].filter((x) => x && nm.indexOf(String(x).toLowerCase()) < 0).filter((x, i, a) => a.indexOf(x) === i).join(' · '); };
  const roasterOf = (b) => String(b.roaster || '').trim() || 'SEY';
  const RT = ['#fcab79', '#a8d8c4', '#f4d35e', '#d4b8ec', '#f4a0b4', '#e8c79e'];
  const rtColor = (n) => { if (n === 'SEY') return RT[0]; let h = 0; for (const c of n) h = (h * 31 + c.codePointAt(0)) >>> 0; return RT[1 + (h % (RT.length - 1))]; };
  const rtTag = (b) => { const n = roasterOf(b); return `<span class="rt" style="--rt:${rtColor(n)}" translate="no">${esc(n)}</span>`; };
  const metaOf = (b) => {
    const parts = [b.country || (b.roaster ? '' : '원두 정보 채우는 중')].filter(Boolean);
    const d = daysSince(b.roast);
    if (d != null) parts.push('로스팅 +' + d + '일');
    return parts.join(' · ');
  };

  // ---------- 그리기 ----------
  function setStatus(t) { $('#status').textContent = t; }
  function announce(t) { const el = $('#live'); el.textContent = ''; setTimeout(() => { el.textContent = t; }, 50); }
  const fmtNum = new Intl.NumberFormat('ko-KR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fmtDay = new Intl.DateTimeFormat('ko-KR', { month: 'numeric', day: 'numeric', timeZone: 'Asia/Seoul' });
  const dayText = (iso) => {
    const dt = new Date(String(iso).slice(0, 10) + 'T12:00:00+09:00');
    if (isNaN(dt)) return '';   // 노션에 잘못 적힌 날짜가 있어도 화면 전체가 멈추지 않게
    const parts = fmtDay.formatToParts(dt);
    const v = (t) => (parts.find((x) => x.type === t) || {}).value || '';
    return pad(v('month')) + '.' + pad(v('day'));
  };

  // 다시 그려도 포커스·입력 위치 유지
  function focusKey(el) {
    if (!el || el === document.body) return null;
    if (el.id && el.id.indexOf('n-') === 0) return { sel: '#' + el.id, caret: el.selectionStart };
    const d = el.dataset || {};
    if (d.rate) return { sel: '[data-rate="' + d.rate + '"][data-n="' + d.n + '"]' };
    if (d.note) return { sel: '[data-note="' + d.note + '"]' };
    if (d.felt != null) return { sel: '[data-felt="' + CSS.escape(d.felt) + '"]' };
    if (el.id && el.id.indexOf('fa-') === 0) return { sel: '#' + el.id, caret: el.selectionStart };
    if (d.open) return { sel: '[data-open="' + d.open + '"]' };
    if (d.past) return { sel: '[data-past="' + d.past + '"]' };
    if (d.me) return { sel: '[data-me="' + d.me + '"]' };
    return null;
  }
  function restoreFocus(k) {
    if (!k) return;
    const el = document.querySelector(k.sel);
    if (!el) return;
    el.focus({ preventScroll: true });
    if (k.caret != null && el.setSelectionRange) el.setSelectionRange(k.caret, k.caret);
  }

  function render() {
    const fk = focusKey(document.activeElement);
    paint();
    restoreFocus(fk);
  }

  function paint() {
    renderAdd();
    $('#radarLink').hidden = !(S.me && ADDERS.indexOf(S.me) >= 0);
    // 멤버
    $('#picker').hidden = !!S.me;
    $('#meBtn').hidden = !S.me;
    $('#meTxt').textContent = S.me || '';
    if (S.badKey) $('#pickerTxt').textContent = '이 링크는 이제 안 돼요. 새 링크를 받아주세요.';

    // DROP 박스
    const d = curDrop();
    const list = d ? inDrop(d) : [];
    $('#dropBox').hidden = !d;
    if (d) {
      const arrived = list.map((b) => b.arrived).filter(Boolean).sort()[0];
      $('#dropLbl').textContent = arrived ? dayText(arrived) + ' 도착' : ''; $('#dropLbl').hidden = !arrived;
      $('#dropTitle').textContent = 'Drop ' + pad(d);
      const done = S.me ? list.filter((b) => myScore(b)).length : 0;
      $('#mineN').textContent = done + '/' + list.length;
      $('#trackFill').style.transform = 'scaleX(' + (list.length ? done / list.length : 0) + ')';
    }

    // 로스터리 분류: 이 DROP에 로스터리가 둘 이상일 때만 칩을 보여줌
    const rs = [...new Set(list.map(roasterOf))].sort((a, b) => (a === 'SEY' ? -1 : b === 'SEY' ? 1 : a.localeCompare(b, 'ko')));
    if (S.roaster !== 'all' && rs.indexOf(S.roaster) < 0) S.roaster = 'all';
    $('#rfil').hidden = rs.length < 2;
    $('#rfil').innerHTML = rs.length < 2 ? '' : ['all'].concat(rs).map((n) => {
      const c = n === 'all' ? list.length : list.filter((b) => roasterOf(b) === n).length;
      return `<button type="button" aria-pressed="${S.roaster === n}" data-roaster="${esc(n)}" translate="no">${n === 'all' ? '전체' : `<i style="--rt:${rtColor(n)}"></i>${esc(n)}`}<b class="num">${c}</b></button>`;
    }).join('');
    const shown = S.roaster === 'all' ? list : list.filter((b) => roasterOf(b) === S.roaster);

    renderDrop(shown);
    renderTodo();
    renderPast();
    renderHall();
    renderSheet();
  }

  function renderDrop(list) {
    const el = $('#viewDrop');
    if (!S.data) {
      el.innerHTML = S.failed
        ? '<div class="empty"><span>원두 목록을 불러오지 못했어요.</span><button type="button" class="btn-line" data-retry="1">다시 불러오기</button></div>'
        : '<div aria-hidden="true">' + '<div class="skel"><i></i><span><i></i><i></i></span></div>'.repeat(3) + '</div>';
      return;
    }
    if (!list.length) {
      el.innerHTML = '<div class="empty"><span>첫 DROP을 기다리는 중이에요.</span><span>원두가 도착하면 여기에 올라와요.</span></div>';
      return;
    }
    el.innerHTML = list.map((b) => rowHTML(b)).join('');
  }
  function rowHTML(b, withDrop) {
    const mine = myScore(b);
    const status = !S.me ? '보기' : mine ? ICON.star + mine : '평가하기';
    const meta = [withDrop ? 'DROP ' + pad(b.drop) : '', metaOf(b)].filter(Boolean).join(' · ');
    return `<article class="bean" id="${withDrop ? 't' : 'b'}-${b.id}">
        <button type="button" class="row" aria-haspopup="dialog" aria-expanded="${S.open === b.id}" data-open="${b.id}">
          <span class="no mono">${esc(b.no)}</span>
          <span class="tx"><span class="nm" translate="no">${esc(b.name)}</span><span class="mt">${rtTag(b)}<span>${esc(meta)}</span></span></span>
          <span class="st ${mine ? 'done' : ''}"${mine ? ` aria-label="내 점수 ${mine}점"` : ''}>${status}</span>
        </button>
      </article>`;
  }
  // 밀린 평가: 지난 DROP에서 내가 아직 평가 안 한 원두
  function renderTodo() {
    const latest = curDrop();
    const todo = S.me && S.data ? beans().filter((b) => b.drop !== latest && !myScore(b)) : [];
    $('#secTodo').hidden = !todo.length;
    $('#todoN').textContent = todo.length ? todo.length + '개 남음' : '';
    $('#viewTodo').innerHTML = todo.map((b) => rowHTML(b, true)).join('');
  }
  // 지난 DROP: DROP마다 접힌 한 줄, 누르면 원두 목록
  function renderPast() {
    const past = S.data ? drops().slice(1) : [];
    $('#secPast').hidden = !past.length;
    $('#viewPast').innerHTML = past.map((d) => {
      const list = inDrop(d);
      const arrived = list.map((b) => b.arrived).filter(Boolean).sort()[0];
      const rated = list.filter((b) => Object.keys(b.ratings).length);
      const avg = rated.length ? rated.reduce((t, b) => t + avgOf(b), 0) / rated.length : null;
      const top = rated.slice().sort((x, y) => avgOf(y) - avgOf(x))[0];
      const open = S.drop === d;
      const sub = [arrived ? dayText(arrived) + ' 도착' : '', '원두 ' + list.length, avg != null ? '평균 ' + fmtNum.format(avg) : ''].filter(Boolean).join(' · ');
      return `<div class="past-d">
        <button type="button" class="past-h" aria-expanded="${open}" aria-controls="pd-${d}" data-past="${d}">
          <span class="past-n mono">DROP ${pad(d)}</span>
          <span class="past-s"><span>${esc(sub)}</span>${top ? `<span class="past-top" translate="no">최고 ${esc(top.name)}</span>` : ''}</span>
          <span class="past-c" aria-hidden="true">${open ? '−' : '+'}</span>
        </button>
        ${open ? `<div class="past-b" id="pd-${d}">${list.map((b) => rowHTML(b)).join('')}</div>` : ''}
      </div>`;
    }).join('');
  }


  // ---------- 원두 시트: 정보 → 맛보기 흐름 → 내 평가 → 멤버 평가가 한 흐름 ----------
  const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00+09:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const today = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const REST = [7, 21];   // 필터 원두 맛보기 좋은 때: 로스팅 +7 ~ +21일
  function bestOf(b) {   // 맛보기 좋은 때 한 줄 (로스팅 날짜를 알 때만). 디개싱 일수는 노션 '디개싱(일)', 비우면 7일 · 그날부터 2주
    const ds = daysSince(b.roast);
    if (ds == null) return null;
    const r0 = b.rest > 0 ? Math.round(b.rest) : REST[0], r1 = r0 + 14;
    if (ds < r0) return { tone: 'wait', text: `로스팅 +${ds}일 · ${r0 - ds}일 뒤부터 맛보기 좋아요` };
    if (ds <= r1) return { tone: 'now', text: `로스팅 +${ds}일 · 지금 맛보기 좋은 때` };
    return { tone: 'late', text: `로스팅 +${ds}일 · 늦기 전에 마셔 보세요` };
  }
  const VERDICT = ['', '아쉬워요', '그저 그래요', '괜찮아요', '좋아요', '최고예요'];
  const ISSUES = ['산미가 튀어요', '쓴맛', '떫어요', '밍밍해요', '향이 약해요', '뒷맛이 짧아요', '묵은 맛'];   // 3점 이하일 때 고르는 아쉬운 점
  const isIssue = (x) => ISSUES.indexOf(x) >= 0;
  const firstAt = (r) => (r && r.at) || '9999';
  function feltOf(b) {
    if (S.felt[b.id]) return S.felt[b.id];
    const r = S.me && b.ratings[S.me];
    return (r && r.felt) || [];
  }
  function dirty(b) {
    const r = (S.me && b.ratings[S.me]) || {};
    const f = feltOf(b).join('·') !== ((r.felt || []).join('·'));
    const n = S.draft[b.id] != null && S.draft[b.id] !== (r.note || '');
    return f || n;
  }
  function renderSheet() {
    const dlg = $('#sheet');
    const b = S.open && beans().find((x) => x.id === S.open);
    if (!b) { if (dlg.open) dlg.close(); return; }
    const mine = myScore(b);
    const msg = S.msg[b.id];
    const others = ['IB', 'HJ', 'KC'].filter((w) => w !== S.me && b.ratings[w]).length;
    const best = bestOf(b);
    const tiles = [['산지', b.country || '—'], ['가공', b.process || '—'], ['품종', b.varieties.join(' · ') || '—']];
    const facts = [
      b.origin && ['지역', b.origin],
      prodOf(b) && ['생산자', prodOf(b)],
      b.altitude && ['고도', b.altitude],
      b.harvest && ['수확', b.harvest],
      b.price && ['가격', fmtPrice(b.price, b.currency) + (b.size ? ' · ' + b.size : '')]
    ].filter(Boolean);
    const felt = feltOf(b);
    const pool = b.notes.concat(felt.filter((x) => b.notes.indexOf(x) < 0));
    const busy = !!S.busy[b.id];
    $('#shIn').innerHTML = `
      <div class="sh-grab" aria-hidden="true"></div>
      <header class="sh-head">
        <div class="sh-tt">
          <span class="sh-sub"><span class="mono">${esc(b.no)}</span>${rtTag(b)}<span>DROP ${pad(b.drop)}</span></span>
          <h2 id="shName" translate="no">${esc(b.name)}</h2>
        </div>
        <button type="button" class="sh-x" data-close="1" aria-label="닫기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>

      ${best ? `<p class="best ${best.tone}">${esc(best.text)}</p>` : ''}

      <div class="tiles">${tiles.map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>

      ${facts.length ? `<dl class="sh-facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
      ${b.procText || b.desc ? `<details class="story"><summary>로스터리 설명</summary>${[['가공 과정', b.procText], ['원두 이야기', b.desc]].filter((x) => x[1]).map(([h, x]) => `<h4>${h}</h4><p>${esc(x)}</p>`).join('')}</details>` : ''}

      <section class="rate-card" aria-label="내 평가">
        ${!S.me ? `
          ${b.notes.length ? `<div class="sh-h">로스터리 컵 노트</div><div class="chips">${b.notes.map((n) => `<span>${esc(n)}</span>`).join('')}</div>` : ''}
          <p class="cap">카톡 링크로 들어오면 평가를 남길 수 있어요.</p>` : `
          <p class="rc-q">${mine ? `${S.me}의 평가` : '이 원두, 어땠나요?'}</p>${mine ? '<p class="hint rc-edit">다시 마셔 보고 언제든 고칠 수 있어요</p>' : ''}
          <div class="stars big" role="radiogroup" aria-label="별점">
            ${[1, 2, 3, 4, 5].map((n) => `<button type="button" role="radio" aria-checked="${n === mine}" aria-label="${n}점 ${VERDICT[n]}" class="${n <= mine ? 'on' : ''}" data-rate="${b.id}" data-n="${n}" aria-disabled="${busy}">${ICON.star}</button>`).join('')}
          </div>
          <p class="verdict ${mine ? '' : 'idle'}">${mine ? VERDICT[mine] : '별을 누르면 바로 저장돼요'}</p>
          ${mine ? `
            <div class="rc-sec">
              <p class="rc-q">${mine >= 4 ? '어떤 노트가 좋았나요?' : '느낀 노트를 골라 주세요'}</p>
              <div class="felt" role="group" aria-label="느낀 노트">
                ${pool.filter((x) => !isIssue(x)).map((n) => `<button type="button" aria-pressed="${felt.indexOf(n) >= 0}" data-felt="${esc(n)}">${esc(n)}</button>`).join('')}
                <span class="felt-add"><input type="text" id="fa-${b.id}" maxlength="20" autocomplete="off" enterkeyhint="done" placeholder="+ 직접 추가" value="${esc(S.addNote[b.id] || '')}" aria-label="느낀 노트 직접 추가"></span>
              </div>
            </div>
            ${mine <= 3 ? `
              <div class="rc-sec">
                <p class="rc-q">아쉬운 점이 있었나요?</p>
                <div class="felt issue" role="group" aria-label="아쉬운 점">
                  ${ISSUES.map((n) => `<button type="button" aria-pressed="${felt.indexOf(n) >= 0}" data-felt="${esc(n)}">${esc(n)}</button>`).join('')}
                </div>
              </div>` : ''}
            <label class="memo"><span class="rc-q">코멘트 <span class="hint">선택</span></span>
              <textarea name="note" rows="4" maxlength="1000" id="n-${b.id}" placeholder="${mine >= 4 ? '예: 식으면서 복숭아랑 베르가못이 확 올라와요. 아이스로도 좋을 듯.' : '예: 산미가 날카로워서 물 온도를 낮춰 다시 내려 볼게요.'}">${esc(S.draft[b.id] != null ? S.draft[b.id] : ((b.ratings[S.me] || {}).note || ''))}</textarea>
            </label>
            <button type="button" class="btn save" data-note="${b.id}" aria-disabled="${busy || !dirty(b)}">${busy ? '저장 중…' : dirty(b) ? (((b.ratings[S.me] || {}).note || ((b.ratings[S.me] || {}).felt || []).length) ? '수정 저장' : '평가 저장') : '저장됨'}</button>` : ''}
          ${msg ? `<div class="saved ${msg.err ? 'err' : ''}" role="status">${esc(msg.text)}</div>` : ''}`}
      </section>

      <section class="club" aria-label="멤버 평가">
        <div class="sh-h"><span>멤버 평가</span>${mine || !S.me ? `<span class="hint">평균 ${Object.keys(b.ratings).length ? fmtNum.format(avgOf(b)) : '–'}</span>` : ''}</div>
        ${mine || !S.me ? `
          <ul class="mates">${['IB', 'HJ', 'KC'].slice().sort((x, y) => firstAt(b.ratings[x]).localeCompare(firstAt(b.ratings[y]))).map((w) => { const r = b.ratings[w]; return `<li class="${r ? '' : 'none'}">
            <span class="av mono" translate="no">${w}</span>
            <div class="mt-tx"><div class="mt-top"><b translate="no">${w}${w === S.me ? ' (나)' : ''}</b>${r ? `<span class="rv-sc">${ICON.star}${r.score}<em>${VERDICT[r.score]}</em></span>` : '<span class="hint">아직</span>'}</div>
              ${r && r.felt && r.felt.length ? `<div class="mini">${r.felt.map((x) => `<span class="${isIssue(x) ? 'iss' : b.notes.indexOf(x) >= 0 ? '' : 'own'}">${esc(x)}</span>`).join('')}</div>` : ''}
              ${r && r.note ? `<p class="cmt">${esc(r.note)}</p>` : ''}</div></li>`; }).join('')}</ul>`
          : `<p class="cap blind">${others ? `내 점수를 남기면 ${others}명의 평가가 열려요.` : '내 점수를 남기면 다른 멤버 평가가 열려요.'}</p>`}
      </section>`;
    if (!dlg.open) { dlg.showModal(); $('#shIn').scrollTop = 0; }
  }

  function renderHall() {
    const el = $('#viewHall');
    const ranked = beans()
      .filter((b) => Object.keys(b.ratings).length >= 2)
      .map((b) => ({ b, avg: avgOf(b) }))
      .sort((x, y) => y.avg - x.avg || Object.keys(y.b.ratings).length - Object.keys(x.b.ratings).length)
      .slice(0, 10);
    el.innerHTML = (ranked.length
      ? ranked.map((x, i) => `<div class="hall-row">
          <span class="rk mono num">${i + 1}</span>
          <span class="tx"><span class="nm" translate="no">${esc(x.b.name)}</span><span class="mt">${rtTag(x.b)}<span>${[`DROP ${pad(x.b.drop)}`, x.b.country, Object.keys(x.b.ratings).length + '명'].filter(Boolean).map(esc).join(' · ')}</span></span></span>
          <span class="av">${fmtNum.format(x.avg)}</span>
        </div>`).join('')
      : '<div class="empty">두 명 이상 평가한 원두가 생기면 여기에 올라와요.</div>');
  }

  // ---------- 동작 ----------
  async function rate(id, n, note, felt) {
    const b = beans().find((x) => x.id === id);
    if (!b || !S.me || S.busy[id]) return;
    const prev = b.ratings[S.me] ? Object.assign({}, b.ratings[S.me]) : null;
    b.ratings[S.me] = { score: n, note: note != null ? note : (prev ? prev.note : ''), felt: felt != null ? felt : (prev ? prev.felt || [] : []), at: prev && prev.at ? prev.at : new Date().toISOString() };
    S.busy[id] = true;
    S.msg[id] = { text: '저장 중…' };
    render();
    try {
      await send({ bean: id, key: S.key, member: S.me, score: n, note: note, felt: felt });
      S.msg[id] = { text: note != null || felt != null ? '✓ 노트와 코멘트를 저장했어요' : '✓ 별점을 저장했어요' };
      if (note != null) delete S.draft[id];
      if (felt != null) delete S.felt[id];
      store.set(KEY_DATA, JSON.stringify(S.data));
      announce(b.name + ' ' + n + '점' + (note != null ? ', 감상' : '') + ' 저장됨');
    } catch (e) {
      if (prev) b.ratings[S.me] = prev; else delete b.ratings[S.me];
      console.warn('TTCC 저장 실패:', e);
      const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
      if (/KEY/.test(e.message)) { S.badKey = true; S.me = null; S.key = null; store.del(KEY_KEY); store.del(KEY_ME); }
      S.msg[id] = { text: S.badKey ? '링크가 바뀌었어요. 새 링크로 다시 들어와 주세요.' : offline ? '인터넷 연결을 확인하고 다시 눌러주세요.' : '저장하지 못했어요. 잠시 후 다시 눌러주세요.', err: true };
      announce('저장하지 못했어요. 다시 눌러주세요.');
    }
    S.busy[id] = false;
    render();
  }

  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('button, a');
    if (!t) return;
    if (t.dataset.retry) { S.failed = false; render(); load(true); return; }
    if (t.dataset.addclose) { S.add = null; render(); return; }
    if (t.dataset.adddrop) { S.add.drop = Number(t.dataset.adddrop); S.add.err = ''; render(); return; }
    if (t.dataset.addother) { S.add.other = true; render(); return; }
    if (t.dataset.addkind) { S.add.kind = t.dataset.addkind; S.add.err = ''; render(); return; }
    if (t.dataset.addsave) { addBean(); return; }
    if (t.dataset.addgo) { const id = t.dataset.addgo; S.add = null; history.replaceState(null, '', '#b-' + id); applyHash(); render(); return; }
    if (t.dataset.roaster) { S.roaster = t.dataset.roaster; S.open = null; render(); return; }
    if (t.dataset.past) { const d = Number(t.dataset.past); S.drop = S.drop === d ? null : d; history.replaceState(null, '', S.drop ? '#d-' + S.drop : location.pathname); render(); return; }
    if (t.dataset.close) { $('#sheet').close(); return; }
    if (t.dataset.felt != null && t.dataset.felt !== undefined && t.closest('#sheet')) {
      const b = beans().find((x) => x.id === S.open); if (!b) return;
      const f = feltOf(b).slice(); const i = f.indexOf(t.dataset.felt);
      if (i >= 0) f.splice(i, 1); else f.push(t.dataset.felt);
      S.felt[b.id] = f; render(); return;
    }
    if (t.dataset.open) {
      S.open = t.dataset.open;
      history.replaceState(null, '', S.open ? '#b-' + S.open : (S.drop ? '#d-' + S.drop : location.pathname));
      render();
      return;
    }
    if (t.dataset.rate) { rate(t.dataset.rate, Number(t.dataset.n)); return; }
    if (t.dataset.note) {
      const id = t.dataset.note;
      const b = beans().find((x) => x.id === id);
      const v = S.draft[id] != null ? S.draft[id] : (($('#n-' + id) || {}).value || '');
      if (b && myScore(b) && dirty(b) && !S.busy[id]) rate(id, myScore(b), v.trim(), feltOf(b).filter((x) => myScore(b) <= 3 || !isIssue(x)));
    }
  });
  document.addEventListener('input', (ev) => {
    const id = ev.target.id || '';
    if (id.indexOf('n-') === 0) { S.draft[id.slice(2)] = ev.target.value; const btn = document.querySelector('[data-note="' + id.slice(2) + '"]'); const b = beans().find((x) => x.id === id.slice(2)); if (btn && b) { const d = dirty(b); btn.setAttribute('aria-disabled', String(!!S.busy[b.id] || !d)); btn.textContent = d ? (((b.ratings[S.me] || {}).note || ((b.ratings[S.me] || {}).felt || []).length) ? '수정 저장' : '평가 저장') : '저장됨'; } }
    if (id.indexOf('fa-') === 0) S.addNote[id.slice(3)] = ev.target.value;
  });
  $('#sheet').addEventListener('close', () => {
    if (!S.open) return;
    S.open = null;
    history.replaceState(null, '', S.drop ? '#d-' + S.drop : location.pathname);
    render();
  });
  $('#sheet').addEventListener('click', (ev) => { if (ev.target === ev.currentTarget) ev.currentTarget.close(); });   // 시트 밖 어두운 곳
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.id && ev.target.id.indexOf('fa-') === 0) {
      ev.preventDefault();
      const id = ev.target.id.slice(3), v = ev.target.value.replace(/·/g, ' ').trim().slice(0, 20);
      const b = beans().find((x) => x.id === id);
      if (b && v) { const f = feltOf(b).slice(); if (f.indexOf(v) < 0) f.push(v); S.felt[id] = f; S.addNote[id] = ''; render(); const el = $('#fa-' + id); if (el) el.focus(); }
      return;
    }
    if (ev.key === 'Enter' && ev.target.tagName === 'INPUT' && ev.target.id && ev.target.id.indexOf('n-') === 0) {
      const btn = document.querySelector('[data-note="' + ev.target.id.slice(2) + '"]');
      if (btn) btn.click();
    }
  });

  // #b-<원두ID>로 열면 그 원두를 펼침 (노션 '별점 링크')
  function applyHash() {
    const dm = location.hash.match(/^#d-(\d+)$/);
    if (dm) { S.drop = Number(dm[1]); return; }
    const m = location.hash.match(/^#b-([0-9a-f]{32})$/);
    if (!m) return;
    const b = beans().find((x) => x.id === m[1]);
    if (!b) return;
    S.drop = b.drop; S.open = b.id;

  }
  window.addEventListener('hashchange', () => { if (takeKey()) { whoami(); return; } if (takeAdd()) return; applyHash(); render(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.data) load(false); });

  if (S.data) { applyHash(); render(); }
  load(true);
  whoami();
  takeAdd();
})();
</script>
</body>
</html>
